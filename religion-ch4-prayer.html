<title>People of Prayer Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: one narrow study column, sticky section tabs, a day-strip of the Hours on Home */
:root{
  --bg:#eef1f7; --surface:#ffffff; --ink:#1c2340; --muted:#5a6384; --line:#d5dbea;
  --accent:#2f3f8f; --accent-soft:#e1e6f7; --gold:#b4862a; --gold-soft:#f6ecd6;
  --good:#1f7a4d; --good-soft:#dcf1e5; --bad:#b03a3a; --bad-soft:#f8e0e0;
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12162a; --surface:#1b2140; --ink:#e8ebf7; --muted:#a3aac6; --line:#2e3660;
  --accent:#9eaeff; --accent-soft:#283166; --gold:#e3b75c; --gold-soft:#3a3120;
  --good:#6fd39f; --good-soft:#173a2a; --bad:#f08c8c; --bad-soft:#432222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12162a; --surface:#1b2140; --ink:#e8ebf7; --muted:#a3aac6; --line:#2e3660;
  --accent:#9eaeff; --accent-soft:#283166; --gold:#e3b75c; --gold-soft:#3a3120;
  --good:#6fd39f; --good-soft:#173a2a; --bad:#f08c8c; --bad-soft:#432222; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:760px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.tab{flex:0 0 auto;border:0;background:none;color:var(--muted);font:600 15px var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.tab[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
main{max-width:760px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,44px)} h2{font-size:26px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
p{margin:0}.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.hour{padding:12px 10px;display:grid;gap:2px;font-size:13px;color:var(--ink)}
.hour b{font-size:14px}
.h1{background:var(--gold-soft)}.h2{background:var(--surface)}.h3{background:var(--accent-soft)}.h4{background:var(--bg)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:16px;cursor:pointer;display:grid;gap:6px;font:inherit}
.mode:hover{border-color:var(--accent)}
.mode .t{font-weight:800;font-size:17px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:10px;padding:11px 18px;font:700 16px var(--body);cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,.mode:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.q{font-size:20px;font-weight:600}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--accent);text-align:center;padding:0 6px;color:var(--accent)}
.blank.ok{color:var(--good);border-color:var(--good)}.blank.no{color:var(--bad);border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 16px var(--body);cursor:pointer}
.chip:disabled{cursor:default;opacity:.55}
.chip.ok{background:var(--good-soft);border-color:var(--good);color:var(--good);opacity:1}
.chip.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);opacity:1}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px 14px;font:600 16px var(--body);cursor:pointer;display:flex;gap:10px}
.opt .k{font-weight:800;color:var(--muted)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px}
.fb.ok{background:var(--good-soft);color:var(--good)}.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb span{color:var(--ink);font-weight:400}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:12px;font:16px var(--body);background:var(--bg);color:var(--ink);resize:vertical}
.sample{border-left:4px solid var(--gold);background:var(--gold-soft);padding:12px 14px;border-radius:0 10px 10px 0}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font-size:14px;font-weight:700;padding:4px 10px;border-radius:99px}
.key.hit{background:var(--good-soft);color:var(--good)}.key.miss{background:var(--bad-soft);color:var(--bad)}
.facts{display:grid;gap:10px}
.fact{border-bottom:1px solid var(--line);padding-bottom:10px;display:grid;gap:2px}
.fact:last-child{border:0;padding:0}
.fact b{color:var(--accent)}
.score{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.speak{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 10px;font:600 13px var(--body);cursor:pointer}
@media (max-width:480px){.hours{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .25s ease}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
<main id="app"></main>

<script>
// ---------- CONTENT: Christ Our Life Gr. 8, Ch. 4 "A People of Prayer" (pp. 29–36) ----------
const FACTS=[
 ["Faith Focus","The Church deepens its relationship with God through prayer, especially the eucharistic liturgy (the Mass) and the Liturgy of the Hours."],
 ["Prayer","Lifting up the mind and heart to God. It is an expression of faith and love. We can pray with words, song, or in silence."],
 ["Two basic forms","Communal prayer (praying with others) and personal prayer (praying alone)."],
 ["Liturgy","The public prayer of the Church that celebrates the wonderful things God has done for us in Jesus Christ. The word means a public work or service done for the people."],
 ["Liturgy of the Hours","The public prayer of the Church to praise God and sanctify (make holy) the day. Prayed at set times: morning, during the day, evening, and night. It is part of the living Tradition of the Church."],
 ["The Mass","The paschal meal and the most important act of worship in our Catholic faith."],
 ["The Eucharist","The Eucharist is the Body and Blood of Jesus Christ, truly present under the appearance of bread and wine. Jesus gave up his life on the cross to save us, and at Mass we share in his sacrifice and receive him in Holy Communion. It is the center of the Church's prayer and unites us as the Body of Christ."],
 ["Most important prayer","The Lord's Prayer (Our Father). The disciples asked Jesus to teach them how to pray, and he gave them this prayer."],
 ["Jesus prayed","Jesus prayed traditional Jewish prayers, such as the Shema. He taught: “Ask and you will receive; seek and you will find; knock and the door will be opened to you” (Luke 11:9)."],
 ["Persistent widow","Luke 18:1–8. A widow kept asking a judge until he helped her. Jesus teaches us to keep praying and never give up."],
 ["Mary","Mother of the Church and a model of prayer because of her listening heart. At the Annunciation (March 25) the angel told her she would be the Mother of Jesus, and she listened and said yes."],
 ["Five types of prayer","Blessing and Adoration (praising God) • Contrition (asking forgiveness) • Petition (asking for what we need) • Intercession (asking for what others need) • Thanksgiving (thanking God for what he has given and done)."],
 ["Petition vs. Intercession","Petition = asking for what WE need. Intercession = asking on behalf of OTHERS."],
 ["Ora et Labora","Latin for “pray and work.” Prayer and work go together; we can offer our work to God."],
 ["Prayer times & places","Set regular times to pray and find a quiet place with few distractions. Prayer is like a friendship: it takes time and persistent love."],
 ["Pope John Paul II","Died April 2, 2005. Crowds gathered in St. Peter's Square to pray for him, showing the Church as a people of prayer."],
 ["A Catholic to Know","St. John Vianney invited people into a closer relationship with God through prayer (p. 38)."]
];

const FILL=[
 ["Prayer is lifting up the mind and ___ to God.","heart"],
 ["Praying with others is called ___ prayer.","communal"],
 ["Praying alone is called ___ prayer.","personal"],
 ["The ___ is the public prayer of the Church to praise God and sanctify the day.","Liturgy of the Hours"],
 ["___ is the public prayer of the Church that celebrates the wonderful things God has done for us in Jesus Christ.","Liturgy"],
 ["The word liturgy means a public ___ or service done for the people.","work"],
 ["The Eucharist is the Body and ___ of Jesus Christ.","Blood"],
 ["In the Eucharist we remember that Jesus gave up his ___ to save us.","life"],
 ["When we receive the Eucharist at Mass, it is called Holy ___.","Communion"],
 ["The ___ is the paschal meal and the most important act of worship in our Catholic faith.","Mass"],
 ["Jesus prayed traditional Jewish prayers, such as the ___.","Shema"],
 ["The Feast of the Annunciation is celebrated on ___.","March 25"],
 ["A prayer of ___ asks God for forgiveness.","contrition"],
 ["A prayer of ___ asks God for what others need.","intercession"],
 ["A prayer of ___ thanks God for what he has given and done.","thanksgiving"],
 ["A prayer of ___ asks God for what we need.","petition"],
 ["A prayer of blessing and ___ praises God.","adoration"],
 ["The most important prayer of the Church is the ___.","Lord's Prayer"],
 ["Mary is a model of prayer because she had a ___ heart.","listening"],
 ["“Ask and you will receive; seek and you will find; knock and the door will be opened to you” is found in Luke ___.","11:9"],
 ["In Luke 18:1–8, the persistent ___ teaches us to keep praying and never give up.","widow"],
 ["Ora et Labora means “pray and ___.”","work"],
 ["The Liturgy of the Hours helps us ___ the day, or make it holy.","sanctify"],
 ["Pope ___ died on April 2, 2005, while crowds prayed for him in St. Peter's Square.","John Paul II"],
 ["The Church is called the People of God, and we are a people of ___.","prayer"]
];

const MC=[
 ["What is prayer?",["Reciting memorized words at Mass","Lifting up the mind and heart to God","Asking God for things we want","Reading the Bible silently"],1,"Prayer is lifting up the mind and heart to God, an expression of faith and love."],
 ["What are the two basic forms of prayer?",["Spoken and sung","Morning and evening","Communal and personal","Petition and thanksgiving"],2,"Communal = with others. Personal = alone."],
 ["The Liturgy of the Hours is prayed to praise God and to…",["sanctify the day","celebrate a sacrament","prepare for Confirmation","honor one saint"],0,"It praises God and makes the whole day holy."],
 ["Which prayer is the most important prayer of the Church?",["The Hail Mary","The Shema","The Glory Be","The Lord's Prayer"],3,"Jesus taught the Lord's Prayer when his disciples asked him how to pray."],
 ["Praying on behalf of other people is a prayer of…",["Contrition","Intercession","Adoration","Thanksgiving"],1,"Intercession = asking for what others need."],
 ["Asking God for forgiveness is a prayer of…",["Contrition","Blessing","Praise","Intercession"],0,"Contrition means being sorry and asking forgiveness."],
 ["Asking God for what we need is a prayer of…",["Adoration","Thanksgiving","Petition","Blessing"],2,"Petition (also called supplication) is asking for what we need."],
 ["Why is the Eucharist important?",["It is a symbol we use only at Christmas","It is the Body and Blood of Christ, who gave his life to save us","It replaces the need to pray","It is a reward for good behavior"],1,"The Eucharist is truly Jesus, the Body and Blood of Christ. He gave up his life to save us, and we receive him in Holy Communion."],
 ["What is the most important act of worship in the Catholic faith?",["The Rosary","The Liturgy of the Hours","The Mass","Personal prayer"],2,"The Mass, the paschal meal, is our most important act of worship."],
 ["What does Jesus teach in the parable of the persistent widow (Luke 18:1–8)?",["Pray only in church","Keep praying and never give up","Short prayers are best","Only pray for big problems"],1,"The widow kept asking until the judge helped her. Never give up on prayer."],
 ["What quality made Mary a model of prayer?",["Her listening heart","Her long prayers","Her singing voice","Her travels"],0,"Mary listened to God. Good prayer includes listening."],
 ["What does “Ora et Labora” mean?",["Love and serve","Morning and evening","Pray and work","Peace be with you"],2,"Prayer and work go together."],
 ["The word liturgy originally means…",["a quiet prayer","a public work or service done for the people","a holy song","a church building"],1,"Liturgy is the Church's public work of prayer."],
 ["What traditional Jewish prayer did Jesus pray?",["The Magnificat","The Shema","The Angelus","The Creed"],1,"Jesus prayed the Shema, a traditional Jewish prayer."],
 ["The Feast of the Annunciation celebrates…",["Jesus' birth","The angel telling Mary she would be the Mother of Jesus","The coming of the Holy Spirit","Jesus' Resurrection"],1,"Celebrated March 25."],
 ["Which is NOT one of the five types of prayer?",["Thanksgiving","Intercession","Contrition","Celebration"],3,"The five: blessing/adoration, contrition, petition, intercession, thanksgiving."],
 ["When is the Liturgy of the Hours prayed?",["Only on Sundays","At set times through the day, from morning to night","Only during Lent","Only by the pope"],1,"Morning, daytime, evening, and night prayer."],
 ["Why did people gather in St. Peter's Square in April 2005?",["To elect a new pope","To pray for Pope John Paul II","To celebrate Easter","To see a canonization"],1,"They prayed for John Paul II, who died April 2, 2005."],
 ["Thanking God for what he has given and done is a prayer of…",["Thanksgiving","Petition","Contrition","Intercession"],0,"Thanksgiving thanks God for his gifts."],
 ["Which saint in this chapter invited people closer to God through prayer?",["St. Teresa","St. Hedwig","St. John Vianney","St. Joseph"],2,"St. John Vianney is the chapter's Catholic to Know."]
];

const SA=[
 {q:"What is prayer?",a:"Prayer is lifting up the mind and heart to God. It is an expression of faith and love. We can pray with words, with song, or in silence.",k:[["mind"],["heart"],["god"],["faith","love"]]},
 {t:1,q:"Why is the Eucharist important?",a:"The Eucharist is important because it is the Body and Blood of Jesus Christ. Jesus gave up his life on the cross to save us from sin. At Mass we share in his sacrifice and receive him in Holy Communion, which unites us with Jesus and with one another as the Body of Christ.",k:[["body"],["blood"],["christ","jesus"],["life","died","sacrifice","save"]]},
 {t:1,q:"What are the two basic forms of prayer? Explain each.",a:"The two basic forms are communal prayer and personal prayer. Communal prayer is praying with others, like at Mass. Personal prayer is praying alone.",k:[["communal"],["personal"],["others","together"],["alone"]]},
 {q:"What is the Liturgy of the Hours? When is it prayed and why?",a:"The Liturgy of the Hours is the public prayer of the Church to praise God and sanctify the day. It is prayed at set times: morning, during the day, evening, and at night before bed.",k:[["public"],["praise"],["sanctify","holy"],["morning","evening","night"]]},
 {q:"What prayer of Jesus is the most important prayer of the Church? How did we receive it?",a:"The Lord's Prayer (the Our Father) is the most important prayer of the Church. Jesus taught it when his disciples asked him to teach them how to pray.",k:[["lord's prayer","lords prayer","our father"],["disciples"],["teach","taught"]]},
 {q:"Name the five types of prayer and give an example of when you might pray one of them.",a:"Blessing and adoration (praising God), contrition (asking forgiveness), petition (asking for what we need), intercession (asking for what others need), and thanksgiving (thanking God). For example, I might pray a prayer of intercession for a sick family member.",k:[["adoration","blessing","praise"],["contrition"],["petition","supplication"],["intercession"],["thanksgiving"]]},
 {q:"What does the parable of the persistent widow (Luke 18:1–8) teach us about prayer?",a:"A widow kept asking a judge for justice until he finally helped her. Jesus teaches us to pray always and never give up, because God listens to us even more than the judge did.",k:[["widow"],["never give up","keep","always","persist"],["god"]]},
 {q:"Why is Mary a model of prayer for the Church?",a:"Mary had a listening heart. When the angel announced she would be the Mother of Jesus, she listened to God and said yes. She shows us prayer includes listening, not just talking.",k:[["listen"],["angel","annunciation"],["yes","faith","trust"]]},
 {q:"What is the difference between a prayer of petition and a prayer of intercession?",a:"A prayer of petition asks God for what we need. A prayer of intercession asks God for what other people need, praying on their behalf.",k:[["petition"],["we need","ourselves","our"],["intercession"],["others","behalf"]]},
 {q:"What is liturgy, and what is the most important act of worship in our faith?",a:"Liturgy is the public prayer of the Church that celebrates the wonderful things God has done for us in Jesus Christ. The Mass is the most important act of worship in our Catholic faith.",k:[["public"],["jesus","christ"],["mass"]]},
 {q:"What does “Ora et Labora” mean, and how can you live it?",a:"Ora et Labora means “pray and work.” It teaches that prayer and work go together. I can live it by offering my schoolwork or chores to God and praying before I start.",k:[["pray"],["work"],["offer","together","god"]]}
];

// ---------- STORAGE ----------
const KEY="col-g8-ch4-progress";
let P={fill:{},mc:{},sa:{}};
try{const s=localStorage.getItem(KEY); if(s) P=Object.assign(P,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}
function mark(sec,i,ok){P[sec][i]=ok?1:0;save();}
function mastered(sec,n){let c=0;for(let i=0;i<n;i++)if(P[sec][i]===1)c++;return c;}

// ---------- HELPERS ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function pickOrder(sec,n,size){ // weakest first: wrong, then unseen, then mastered
  const idx=shuffle([...Array(n).keys()]);
  const score=i=>P[sec][i]===0?0:P[sec][i]===undefined?1:2;
  idx.sort((a,b)=>score(a)-score(b));
  return size?idx.slice(0,size):idx;
}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/___/g,"blank"));u.rate=.95;speechSynthesis.speak(u);}catch(e){}}
const speakBtn=t=>`<button class="speak" data-say="${esc(t)}" aria-label="Read aloud">\u{1F50A} Read aloud</button>`;
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b)speak(b.dataset.say);});
const ANSWERS=[...new Set(FILL.map(f=>f[1]))];
const fillBank=ans=>shuffle([ans,...shuffle(ANSWERS.filter(a=>a!==ans)).slice(0,3)]);

// ---------- NAV ----------
const VIEWS=[["home","Home"],["learn","Key Facts"],["fill","Fill in the Blank"],["mc","Multiple Choice"],["sa","Short Answer"],["test","Practice Test"]];
let view="home", full=false;
function nav(v){view=v;try{speechSynthesis.cancel();}catch(e){}renderTabs();
  ({home:home,learn:learn,fill:()=>startFill(),mc:()=>startMC(),sa:()=>startSA(),test:startTest})[v]();
  window.scrollTo(0,0);}
function renderTabs(){$("#tabs").innerHTML=`<a class="tab" href="./" style="text-decoration:none">← Study Central</a>`+VIEWS.map(([k,l])=>`<button class="tab" aria-current="${k===view}" onclick="nav('${k}')">${l}</button>`).join("");}

// ---------- HOME ----------
function home(){
  const m=(s,n)=>Math.round(mastered(s,n)/n*100);
  $("#app").innerHTML=`
  <header style="display:grid;gap:8px">
    <span class="eyebrow">Christ Our Life · Grade 8 · Chapter 4 · pp. 29–36</span>
    <h1>A People of Prayer</h1>
    <p class="muted">The Church deepens its relationship with God through prayer, especially the eucharistic liturgy and the Liturgy of the Hours.</p>
  </header>
  <section class="hours" aria-label="The Liturgy of the Hours through the day">
    <div class="hour h1"><b>Morning Prayer</b>at dawn</div>
    <div class="hour h2"><b>Daytime Prayer</b>during the day</div>
    <div class="hour h3"><b>Evening Prayer</b>at sunset</div>
    <div class="hour h4"><b>Night Prayer</b>before bed</div>
  </section>
  <section class="modes">
    ${modeCard("learn","Key Facts","Read the 17 big ideas first.",null)}
    ${modeCard("fill","Fill in the Blank",`${FILL.length} sentences with a word bank`,m("fill",FILL.length))}
    ${modeCard("mc","Multiple Choice",`${MC.length} questions`,m("mc",MC.length))}
    ${modeCard("sa","Short Answer",`${SA.length} written questions`,m("sa",SA.length))}
    ${modeCard("test","Practice Test","Mixed: 6 fill-in, 6 multiple choice, plus the 2 review-sheet questions",null)}
  </section>
  <div class="panel">
    <div class="row" style="justify-content:space-between">
      <label class="row" style="gap:8px;font-weight:600"><input type="checkbox" id="full" ${full?"checked":""} onchange="full=this.checked"> Full review (every question, not just 8)</label>
      <button class="btn ghost" onclick="resetP()">Reset progress</button>
    </div>
    <p class="muted" style="font-size:14px">Rounds show the questions you missed first. Progress is saved on this device.</p>
  </div>`;
}
function modeCard(k,t,d,pct){return `<button class="mode" onclick="nav('${k}')"><span class="t">${t}</span><span class="muted" style="font-size:14px">${d}</span>${pct===null?"":`<div class="bar" aria-label="${pct}% mastered"><i style="width:${pct}%"></i></div><span style="font-size:13px;font-weight:700;color:var(--good)">${pct}% mastered</span>`}</button>`;}
function resetP(){P={fill:{},mc:{},sa:{}};save();home();}

// ---------- LEARN ----------
function learn(){
  $("#app").innerHTML=`<header style="display:grid;gap:6px"><span class="eyebrow">Read first</span><h2>Key Facts</h2></header>
  <div class="panel facts">${FACTS.map(([t,d])=>`<div class="fact"><b>${t}</b><span>${d}</span></div>`).join("")}</div>
  <div class="row"><button class="btn" onclick="nav('fill')">Start Fill in the Blank</button></div>`;
}

// ---------- ROUND ENGINE ----------
let R=null; // {items:[{type,i}], pos, score, auto, title}
function startRound(items,title){R={items,pos:0,score:0,auto:0,title};step();}
function startFill(){startRound(pickOrder("fill",FILL.length,full?0:8).map(i=>({type:"fill",i})),"Fill in the Blank");}
function startMC(){startRound(pickOrder("mc",MC.length,full?0:8).map(i=>({type:"mc",i})),"Multiple Choice");}
function startSA(){startRound(pickOrder("sa",SA.length,full?0:3).map(i=>({type:"sa",i})),"Short Answer");}
function startTest(){startRound([
  ...pickOrder("fill",FILL.length,6).map(i=>({type:"fill",i})),
  ...pickOrder("mc",MC.length,6).map(i=>({type:"mc",i})),
  ...SA.map((x,i)=>x.t?i:-1).filter(i=>i>=0).map(i=>({type:"sa",i}))],"Practice Test");}

function head(){const it=R.items[R.pos];const sec={fill:"Fill in the blank",mc:"Multiple choice",sa:"Short answer"}[it.type];
  return `<div class="row" style="justify-content:space-between"><span class="eyebrow">${R.title} · ${sec}</span><span class="pill">${R.pos+1} / ${R.items.length} · Score ${R.score}</span></div>
  <div class="bar"><i style="width:${R.pos/R.items.length*100}%;background:var(--accent)"></i></div>`;}
function nextBtn(){return `<div class="row"><button class="btn" id="nextb" onclick="R.pos++;step()">${R.pos+1<R.items.length?"Next":"See results"}</button></div>`;}
function step(){
  if(R.pos>=R.items.length) return results();
  const it=R.items[R.pos];
  ({fill:showFill,mc:showMC,sa:showSA})[it.type](it.i);
}

function showFill(i){
  const [s,a]=FILL[i];const parts=s.split("___");
  $("#app").innerHTML=`<div class="panel">${head()}
   <p class="q">${esc(parts[0])}<span class="blank" id="blank">&nbsp;</span>${esc(parts[1])}</p>
   <div>${speakBtn(s)}</div>
   <div class="chips" id="chips">${fillBank(a).map(w=>`<button class="chip" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>
   <div id="fb"></div><div id="nx"></div></div>`;
  $("#chips").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;const w=c.dataset.w,ok=w===a;
    document.querySelectorAll(".chip").forEach(x=>{x.disabled=true;if(x.dataset.w===a)x.classList.add("ok");});
    if(!ok)c.classList.add("no");
    const b=$("#blank");b.textContent=a;b.className="blank "+(ok?"ok":"no");
    if(ok)R.score++;mark("fill",i,ok);
    $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Correct!":"Not quite."}</b> ${ok?"":`<span>The answer is <b>${esc(a)}</b>.</span>`}</div>`;
    $("#nx").innerHTML=nextBtn();$("#nextb").focus();};
}

function showMC(i){
  const [q,opts,ans,ex]=MC[i];const order=shuffle(opts.map((o,k)=>k));
  $("#app").innerHTML=`<div class="panel">${head()}
   <p class="q">${esc(q)}</p><div>${speakBtn(q)}</div>
   <div class="opts" id="opts">${order.map((k,n)=>`<button class="opt" data-k="${k}"><span class="k">${"ABCD"[n]}</span><span>${esc(opts[k])}</span></button>`).join("")}</div>
   <div id="fb"></div><div id="nx"></div></div>`;
  $("#opts").onclick=e=>{const b=e.target.closest(".opt");if(!b)return;const ok=+b.dataset.k===ans;
    document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===ans)x.classList.add("ok");});
    if(!ok)b.classList.add("no");if(ok)R.score++;mark("mc",i,ok);
    $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Correct!":"Not quite."}</b> <span>${esc(ex)}</span></div>`;
    $("#nx").innerHTML=nextBtn();$("#nextb").focus();};
}

function showSA(i){
  const s=SA[i];
  $("#app").innerHTML=`<div class="panel">${head()}
   ${s.t?'<span class="pill" style="justify-self:start;background:var(--gold-soft);color:var(--gold)">On the review sheet</span>':""}<p class="q">${esc(s.q)}</p><div>${speakBtn(s.q)}</div>
   <label for="ans" class="muted" style="font-size:14px">Write your answer in 2–3 complete sentences.</label>
   <textarea id="ans" placeholder="Type your answer here…"></textarea>
   <div class="row"><button class="btn" id="chk">Check my answer</button></div>
   <div id="fb"></div></div>`;
  $("#chk").onclick=()=>{
    const t=$("#ans").value.toLowerCase().replace(/[’]/g,"'");
    const res=s.k.map(g=>({label:g[0],hit:g.some(w=>t.includes(w))}));
    const hits=res.filter(r=>r.hit).length;
    $("#chk").disabled=true;
    $("#fb").innerHTML=`
     <div style="display:grid;gap:6px"><b>Key ideas you included (${hits}/${res.length})</b>
     <div class="keys">${res.map(r=>`<span class="key ${r.hit?"hit":"miss"}">${r.hit?"✓":"✗"} ${esc(r.label)}</span>`).join("")}</div></div>
     <div class="sample"><b>Sample answer</b><br>${esc(s.a)} ${speakBtn(s.a)}</div>
     <p style="font-weight:700">Compare with the sample. Did you get it?</p>
     <div class="row"><button class="btn" onclick="saGrade(${i},true)">Yes, I got it</button><button class="btn ghost" onclick="saGrade(${i},false)">Need more practice</button></div>`;
  };
}
function saGrade(i,ok){if(ok)R.score++;mark("sa",i,ok);R.pos++;step();}

function results(){
  const n=R.items.length,pct=Math.round(R.score/n*100);
  const msg=pct>=90?"Excellent! You're ready.":pct>=75?"Strong work. Review the ones you missed.":pct>=50?"Good start. Go over Key Facts and try again.":"Keep going. Read Key Facts, then practice again.";
  $("#app").innerHTML=`<div class="panel" style="text-align:center;justify-items:center">
   <span class="eyebrow">${R.title} complete</span>
   <div class="score">${R.score} / ${n}</div><p class="q">${pct}%</p><p class="muted">${msg}</p>
   <div class="row" style="justify-content:center"><button class="btn" onclick="nav('${view}')">Try again</button><button class="btn ghost" onclick="nav('home')">Home</button></div></div>`;
}

nav("home");
</script>
