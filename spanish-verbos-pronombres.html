const CHART=["beber","saltar","escribir"];
// Pronoun info. req = must write; opt = also OK. Abbreviations from the test: S P M F FO IFO
const PRON=[
 {es:"Yo",n:1,en:"I",req:["I","S"],opt:["M/F"],note:"I · singular"},
 {es:"Tú",n:3,en:"you",req:["you","S","IFO"],opt:["M/F"],note:"you · singular · informal (a friend, family)"},
 {es:"Él",n:1,en:"he",req:["he","S","M"],opt:[],note:"he · singular · masculine"},
 {es:"Ella",n:1,en:"she",req:["she","S","F"],opt:[],note:"she · singular · feminine"},
 {es:"Usted",n:4,en:"you",req:["you","S","FO"],opt:["M/F","IFO"],note:"you · singular · formal (a teacher, a stranger) · man or woman"},
 {es:"Nosotros",n:2,en:"we",req:["we","P","M/mixed"],opt:[],note:"we · plural · masculine or mixed group"},
 {es:"Nosotras",n:2,en:"we",req:["we","P","F"],opt:[],note:"we · plural · feminine (all girls)"},
 {es:"Vosotros",n:4,en:"you all",req:["you all","P","M/mixed","IFO"],opt:[],note:"you all · plural · masculine or mixed · informal (used in Spain)"},
 {es:"Vosotras",n:4,en:"you all",req:["you all","P","F","IFO"],opt:[],note:"you all · plural · feminine · informal (used in Spain)"},
 {es:"Ellos",n:2,en:"they",req:["they","P","M/mixed"],opt:[],note:"they · plural · masculine or mixed group"},
 {es:"Ellas",n:2,en:"they",req:["they","P","F"],opt:[],note:"they · plural · feminine (all girls)"},
 {es:"Ustedes",n:4,en:"you all",req:["you all","P","FO","IFO"],opt:["M/mixed"],note:"you all · plural · formal or informal depending on the region (in Latin America it is used for everyone)"}
];

 ["Vosotras","mucho para el examen.","ESTUDIAR","estudiáis"],["Mi hermano","agua.","BEBER","bebe"],["Nosotros","las escaleras.","SUBIR","subimos"],
 ["Tú","en el parque.","CORRER","corres"],["Ustedes","español en la escuela.","APRENDER","aprenden"],["Nosotras","una carta.","ESCRIBIR","escribimos"],
 ["El profesor","la puerta.","ABRIR","abre"],["Yo","música en mi habitación.","ESCUCHAR","escucho"],["Los estudiantes","en la cafetería.","COMER","comen"],
 ["Usted","muy bien el italiano.","HABLAR","habla"],["Mi madre","la cena.","COCINAR","cocina"],["Ellas","ropa en la tienda.","VENDER","venden"],
 ["Vosotros","a España en verano.","VIAJAR","viajáis"],["Mi amiga","su casa.","DESCRIBIR","describe"],["Tú","una manzana.","COMER","comes"],
 ["Nosotros","la televisión.","MIRAR","miramos"],["Los chicos","a la escuela.","ASISTIR","asisten"]
];

 ["acabar","to finish / to end"],["actuar","to act / to perform"],["andar","to walk"],["bailar","to dance"],["caminar","to walk"],["cantar","to sing"],["cocinar","to cook"],["comprar","to buy"],["completar","to complete"],["escuchar","to listen"],["estudiar","to study"],["enviar","to send"],["hablar","to speak / to talk"],["llorar","to cry"],["mirar","to look at / to watch"],["nadar","to swim"],["pintar","to paint"],["preguntar","to ask"],["saltar","to jump"],["terminar","to finish"],["tocar","to play an instrument / to touch"],["trabajar","to work"],["viajar","to travel"],["visitar","to visit"],

];

const $=s=>document.querySelector(s);

const clean=s=>String(s).trim().toLowerCase().replace(/\s+/g," ");
const noAcc=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
function grade(typed,ans){const t=clean(typed),a=clean(ans);if(t===a)return "ok";if(t&&noAcc(t)===noAcc(a))return "accent";return "no";}

function pronStep(){

  $("#app").innerHTML=`<div class="panel"><span class="eyebrow">Pronombres · ${PD.i+1} of 12 · Score ${PD.ok}</span>
   <p class="q" style="font-size:30px">${p.es}-${p.n} ${sb(p.es)}</p><p class="muted">Tap the English word and ALL the info for this pronoun.</p>
   ${TAGS.map(([g,ts])=>`<div><p class="muted" style="font-size:13px;font-weight:700;margin-bottom:4px">${g}</p><div class="chips">${ts.map(t=>`<button class="chip" data-t="${esc(t)}" aria-pressed="false">${t}${TAGNAME[t]?` <span style="font-weight:400;font-size:13px">(${TAGNAME[t]})</span>`:""}</button>`).join("")}</div></div>`).join("")}

  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const t=c.dataset.t;sel.has(t)?sel.delete(t):sel.add(t);c.setAttribute("aria-pressed",sel.has(t));});

    document.querySelectorAll(".chip").forEach(c=>{c.disabled=true;const t=c.dataset.t;if(wrong.includes(t))c.classList.add("no");else if(sel.has(t))c.classList.add("ok");else if(missing.includes(t))c.classList.add("miss");});

   <div class="chips" id="chips">${shuffle(opts).map(o=>`<button class="chip" data-w="${o}">${o}</button>`).join("")}</div><div id="fb"></div></div>`;

function sentDrill(kind,list){SD={kind,list:list||(kind==="guide"?shuffle(SENT):Array.from({length:12},genSentence)),i:0,ok:0,miss:[]};sentStep();}

   <table class="chart"><tbody>${T.pron.map(i=>`<tr><td>${PRON[i].es}-${PRON[i].n}</td><td><input class="inp pin" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${PRON[i].es} in English"><div class="fix"></div></td></tr>`).join("")}</tbody></table></div>
  <div class="panel"><b>Part 3 · Complete each sentence with the correct present-tense form of the verb in parentheses.</b>
   ${T.sent.map(([s,rest,V],k)=>`<p class="sent">${k+1}. ${esc(s)} <input class="inp sin" data-k="${k}" style="display:inline-block;width:10em" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Sentence ${k+1}"> ${esc(rest)} <span class="muted">(${V})</span><span class="fix" style="display:block"></span></p>`).join("")}</div>
  <div class="row"><button class="btn" id="grade">Grade my test</button></div><div id="fb"></div>`;
  $("#grade").onclick=gradeTest;

function parsePron(txt){const t=" "+txt.toLowerCase().replace(/[.,;/()]/g," ").replace(/\s+/g," ")+" ";const has=w=>t.includes(" "+w+" ");const got=new Set();
  if(/you all|y'all|you guys/.test(t))got.add("you all");else if(has("you"))got.add("you");
  ["i","he","she","we","they"].forEach(w=>{if(has(w))got.add(w==="i"?"I":w);});
  if(has("s")||/singular/.test(t))got.add("S");if(has("p")||/plural/.test(t))got.add("P");
  if(has("fo")||/(^|[^n])formal/.test(t))got.add("FO");if(has("ifo")||/informal/.test(t))got.add("IFO");
  if(/mixed|masculine\/mixed|m\/mixed/.test(t)||(has("m")&&/mix/.test(t)))got.add("M/mixed");else if(has("m")||/masculine/.test(t))got.add("M");
  if(has("f")||/feminine/.test(t))got.add("F");return got;}
function gradeTest(){
  const [c1,n1]=checkChart();
  let c2=0;document.querySelectorAll(".pin").forEach(i=>{const p=PRON[+i.dataset.i];const got=parsePron(i.value);
    const need=p.req.map(r=>r==="M/mixed"?(got.has("M/mixed")||got.has("M")?null:r):got.has(r)?null:r).filter(Boolean);
    const ok=!need.length;if(ok)c2++;i.classList.add(ok?"ok":"no");i.readOnly=true;i.nextElementSibling.textContent=ok?"":`Full answer: ${p.req.join(", ")}  (${p.note})`;});
  let c3=0;document.querySelectorAll(".sin").forEach(i=>{const [s,rest,V,a]=T.sent[+i.dataset.k];const g=grade(i.value,a);if(g==="ok")c3++;i.classList.add(g==="ok"?"ok":"no");i.readOnly=true;
    i.parentElement.querySelector(".fix").textContent=g==="ok"?"":g==="accent"?`Accent! → ${a}`:`→ ${a}`;});
  const tot=c1+c2+c3,n=n1+6+9,p=Math.round(tot/n*100);best("test",p);$("#grade").disabled=true;
  $("#fb").innerHTML=`<div class="panel" style="text-align:center;justify-items:center"><span class="eyebrow">Your score</span><div class="score">${p}%</div>
   <p>Part 1: <b>${c1}/${n1}</b> · Part 2: <b>${c2}/6</b> · Part 3: <b>${c3}/9</b></p>
   <p class="muted">${p>=90?"¡Excelente! You're ready.":"Go back to the step for the part where you lost the most points, then try again."} Corrections are in red above.</p>
   <div class="row" style="justify-content:center"><button class="btn" onclick="nav('test')">New practice test</button><button class="btn ghost" onclick="nav('home')">Home</button></div></div>`;
  $("#fb").scrollIntoView({behavior:"smooth"});
}

  <p class="muted">${p>=.9?"¡Excelente!":p>=.7?"¡Muy bien! Do it once more to make it stick.":"Keep going. Review the chart, then try again."}</p>
