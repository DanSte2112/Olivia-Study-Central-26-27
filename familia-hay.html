<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mi Familia y Hay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mulish:ital,wght@0,400;0,600;0,800;1,400&display=swap">
<style>
/* Layout: sticky nav (Home · Aprende · Practica · Examen · Progreso); one card at a time. Palette: terracotta-free warm teal + marigold, family-album feel */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --ink:#1c2826; --muted:#5b6b68; --line:#dbe3e1;
  --accent:#0d7a6f; --accent-ink:#ffffff; --accent-soft:#dcf0ed; --mari:#e59a12; --mari-soft:#fcefd6;
  --ok:#1d7f4b; --ok-soft:#e0f3e8; --bad:#bd3b2c; --bad-soft:#fae5e1;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Mulish","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#172220; --ink:#e8f1ef; --muted:#9fb2ae; --line:#2a3a37;
  --accent:#5fd0c3; --accent-ink:#0f1716; --accent-soft:#183a36; --mari:#ffc14d; --mari-soft:#3a2e15;
  --ok:#62d398; --ok-soft:#143422; --bad:#ff8c7d; --bad-soft:#3d1f1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#172220; --ink:#e8f1ef; --muted:#9fb2ae; --line:#2a3a37;
  --accent:#5fd0c3; --accent-ink:#0f1716; --accent-soft:#183a36; --mari:#ffc14d; --mari-soft:#3a2e15;
  --ok:#62d398; --ok-soft:#143422; --bad:#ff8c7d; --bad-soft:#3d1f1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.app{max-width:780px;margin:0 auto;padding-block:16px 48px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.65rem;line-height:1.05;margin:0;cursor:pointer}
.brand small{display:block;font:400 14px var(--body);color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.nav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-block:-8px;border-bottom:1px solid var(--line)}
.nav button{font:800 15px var(--body);padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav #nav-home{border-color:var(--accent);color:var(--accent)}
.nav #nav-home[aria-pressed="true"]{color:var(--accent-ink)}
h2{font-family:var(--display);font-weight:800;font-size:1.4rem;margin:0;line-height:1.2;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:800;font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
.meter{height:10px;background:var(--accent-soft);border-radius:99px;overflow:hidden;flex:1;min-width:140px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:800 16px var(--body);padding:11px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--mari);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.tile{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .name{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.2}
.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.mini{height:6px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.keybox{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 12px 12px 0;font-weight:600}
.warn{border-left:4px solid var(--mari);background:var(--mari-soft);padding:10px 14px;border-radius:0 12px 12px 0}
.eg{background:var(--bg);border-radius:12px;padding:10px 14px}
.eg ul{margin:4px 0 0;padding-left:20px}
.ptab{border-collapse:collapse;width:100%;font-size:16px}
.ptab td,.ptab th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.ptab th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ptab td b{color:var(--accent)}
.scroll{overflow-x:auto}
.prompt{font-family:var(--display);font-weight:600;font-size:clamp(1.25rem,4.6vw,1.6rem);line-height:1.3;margin:0;text-wrap:pretty}
.hint{color:var(--muted);margin-top:-6px}
.choices{display:grid;gap:8px}
.choice{text-align:left;font:400 17px var(--body);padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.typed{display:flex;gap:8px;flex-wrap:wrap}
.typed input{font:400 18px var(--body);padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);flex:1;min-width:0}
.accents{display:flex;gap:6px;flex-wrap:wrap}
.accents button{font:600 16px var(--body);width:40px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)} .fb.info{background:var(--accent-soft)}
.fb strong{font-family:var(--display);font-weight:800;font-size:1.2rem}
.fb.ok strong{color:var(--ok)} .fb.bad strong{color:var(--bad)}
.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.98)}60%{transform:scale(1.01)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.meter i{transition:none}}
.score{font-family:var(--display);font-weight:800;font-size:3rem;margin:0;line-height:1;font-variant-numeric:tabular-nums}
ul.list{margin:0;padding-left:20px;display:grid;gap:6px}
.tree svg{width:100%;height:auto;display:block}
.tree .node{cursor:pointer}
.tree .node rect{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.tree .node.sel rect{fill:var(--accent-soft);stroke-width:3}
.tree .node.me rect{fill:var(--mari-soft);stroke:var(--mari)}
.tree text{fill:var(--ink);font-family:var(--body)}
.tree line,.tree path{stroke:var(--muted);stroke-width:2;fill:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start;min-width:0}
.mt{font:600 16px var(--body);padding:11px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.done{border-color:var(--ok);background:var(--ok-soft);opacity:.5;cursor:default}
.mt.miss{border-color:var(--bad);background:var(--bad-soft)}
.reading{background:var(--mari-soft);border-radius:12px;padding:12px 16px;font-style:italic}
.wtable{width:100%;border-collapse:collapse;font-size:15px}
.wtable td,.wtable th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.wtable td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>

</head><body>
<div class="app">
  <header class="top">
    <h1 class="brand" id="brand">Mi Familia y Hay<small>Español 8 · Quizzes: Possession, Family Tree &amp; Hay · Arte (Cap. 2)</small></h1>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="nav" aria-label="Sections">
    <a id="nav-central" href="index.html#subject-2" style="font:800 15px var(--body);padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none">← Study Central</a>
    <button id="nav-home">🏠 Home</button>
    <button id="nav-learn">Aprende</button>
    <button id="nav-prac">Practica</button>
    <button id="nav-test">Examen</button>
    <button id="nav-arte">🎨 Arte</button>
    <button id="nav-prog">Progreso</button>
  </nav>
  <main id="view"></main>
</div>

<script>
/* ================= HELPERS ================= */
const R=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const norm=s=>String(s).toLowerCase().replace(/[¿?¡!.,;:"“”]/g," ").replace(/\s+/g," ").trim();
const noAcc=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const view=document.getElementById("view");
const NUMW={2:"dos",3:"tres",4:"cuatro",5:"cinco"};

/* ================= VOCAB ================= */
// [singular, plural, gender, english, english plural]
const THINGS=[["libro","libros","m","book","books"],["mochila","mochilas","f","backpack","backpacks"],["lápiz","lápices","m","pencil","pencils"],["mesa","mesas","f","table","tables"],
 ["computadora","computadoras","f","computer","computers"],["perro","perros","m","dog","dogs"],["gato","gatos","m","cat","cats"],["casa","casas","f","house","houses"],["silla","sillas","f","chair","chairs"],
 ["cama","camas","f","bed","beds"],["espejo","espejos","m","mirror","mirrors"],["lámpara","lámparas","f","lamp","lamps"],["reloj","relojes","m","clock","clocks"],["camisa","camisas","f","shirt","shirts"],
 ["ventana","ventanas","f","window","windows"],["ropero","roperos","m","closet","closets"],["merienda","meriendas","f","snack","snacks"],["bicicleta","bicicletas","f","bicycle","bicycles"],
 ["carro","carros","m","car","cars"],["cuaderno","cuadernos","m","notebook","notebooks"],["pluma","plumas","f","pen","pens"],["árbol","árboles","m","tree","trees"]];
const FAM=[["hermano","hermanos","m","brother","brothers"],["hermana","hermanas","f","sister","sisters"],["primo","primos","m","cousin (male)","cousins"],["prima","primas","f","cousin (female)","cousins (female)"],
 ["tío","tíos","m","uncle","uncles"],["tía","tías","f","aunt","aunts"],["abuelo","abuelos","m","grandfather","grandparents"],["abuela","abuelas","f","grandmother","grandmothers"],
 ["padre","padres","m","father","parents"],["madre","madres","f","mother","mothers"],["hijo","hijos","m","son","children / sons"],["hija","hijas","f","daughter","daughters"],
 ["amigo","amigos","m","friend","friends"],["maestro","maestros","m","teacher (male)","teachers"],["maestra","maestras","f","teacher (female)","teachers (female)"]];
const HAYN=THINGS.filter(t=>["cama","espejo","ropero","lámpara","perro","camisa","merienda","reloj","ventana","libro","silla","mesa","gato","computadora","mochila"].includes(t[0]));
const art=(g,pl,def)=>def?(g==="m"?(pl?"los":"el"):(pl?"las":"la")):(g==="m"?(pl?"unos":"un"):(pl?"unas":"una"));

/* ================= POSSESSIVES ================= */
// owner: [english label, code]
const OWN=[["my","mi"],["your (fam.)","tu"],["his","su"],["her","su"],["your (formal)","su"],["our","nuestro"],["their","su"],["your (pl.)","su"]];
function possForm(code,g,pl){if(code==="nuestro")return (g==="m"?"nuestro":"nuestra")+(pl?"s":"");if(code==="vuestro")return (g==="m"?"vuestro":"vuestra")+(pl?"s":"");return code+(pl?"s":"")}
const POSS_ALL=["mi","mis","tu","tus","su","sus","nuestro","nuestra","nuestros","nuestras"];
function possWhy(code,g,pl,noun){
 if(code==="nuestro")return `“Our” = nuestro, and it matches the noun: <b>${noun}</b> is ${g==="m"?"masculine":"feminine"} ${pl?"plural":"singular"} → <b>${possForm(code,g,pl)}</b>.`;
 const w={mi:"my",tu:"your (familiar)",su:"his / her / your (formal) / their / your (pl.)"}[code];
 return `${cap(code)} = ${w}. <b>${noun}</b> is ${pl?"plural, so add -s":"singular"} → <b>${possForm(code,g,pl)}</b>. (Only number matters for mi, tu, su.)`;
}

/* ================= QUESTION GENERATORS ================= */
const GEN={
 // A1-style: translate "my books"
 poss(){const [en,code]=R(OWN),pool=Math.random()<.55?THINGS:FAM.filter(f=>!["madre","madres"].includes(f[0])),n=R(pool),pl=Math.random()<.5;
  const noun=pl?n[1]:n[0],ans=possForm(code,n[2],pl)+" "+noun,acc=[ans];
  if(en==="your (pl.)")acc.push(possForm("vuestro",n[2],pl)+" "+noun);
  return {sk:"poss",type:"type",prompt:`${en} ${pl?n[4]:n[3]}`,hint:"Write it in Spanish.",answer:acc,show:ans,why:possWhy(code,n[2],pl,noun)}},
 // A3-style: context sentence
 _ctx(pool){
  const subs=[["Yo tengo","mi"],["Tú tienes","tu"],["Carlos tiene","su"],["La chica tiene","su"],["Ella tiene","su"],["Él tiene","su"],["Nosotros tenemos","nuestro"],["Tenemos","nuestro"],["Ellas tienen","su"],["Mis padres tienen","su"],["Ustedes tienen","su"],["Carlos y Ana tienen","su"],["La maestra tiene","su"]];
  const [s,code]=R(subs),n=R(pool),pl=Math.random()<.5,cnt=pl?NUMW[R([2,3,4])]:art(n[2],0,0);const noun=pl?n[1]:n[0];
  const ansW=possForm(code,n[2],pl);return {s,code,n,pl,cnt,noun,ansW}},
 choose(){const c=GEN._ctx(THINGS),sent=`${c.s} ${c.cnt} ${c.noun}. ${c.pl?"Son":"Es"} ___ ${c.noun}.`;
  const opts=new Set([c.ansW]);const alt=c.code==="nuestro"?[possForm("nuestro",c.n[2],!c.pl),possForm("nuestro",c.n[2]==="m"?"f":"m",c.pl)]:[possForm(c.code,c.n[2],!c.pl)];
  alt.forEach(a=>opts.add(a));shuffle(POSS_ALL.filter(x=>(x.endsWith("s")===c.pl)||x.startsWith("nuestr"))).forEach(x=>{if(opts.size<4)opts.add(x)});
  return {sk:"choose",type:"mc",prompt:sent,hint:"Who owns it? One thing or more than one?",choices:shuffle([...opts]),answer:[c.ansW],show:c.ansW,why:possWhy(c.code,c.n[2],c.pl,c.noun)}},
 // Section B: family context, typed
 family(){
  if(Math.random()<.4){ // "(her) hijos" style
   const [en,code]=R(OWN.filter(o=>o[0]!=="your (pl.)"&&o[0]!=="your (formal)")),f=R(FAM),pl=Math.random()<.5,noun=pl?f[1]:f[0];
   const ans=possForm(code,f[2],pl);
   return {sk:"family",type:"type",prompt:`(${en}) ${noun}`,hint:"Write the possessive + the family word.",answer:[ans+" "+noun],show:ans+" "+noun,why:possWhy(code,f[2],pl,noun)}}
  const c=GEN._ctx(FAM.filter(f=>!["padre","madre","padres","madres","maestro","maestra"].includes(f[0])));
  const sent=`${c.s} ${c.cnt} ${c.noun}. ___ ${c.noun} ${c.pl?"son":"es"} ${R(["simpátic","alt","inteligent"]).replace(/^(simpátic|alt)$/,m=>m+(c.n[2]==="m"?(c.pl?"os":"o"):(c.pl?"as":"a"))).replace(/^inteligent$/,"inteligente"+(c.pl?"s":""))}.`;
  return {sk:"family",type:"type",prompt:sent,hint:"Write the missing possessive.",answer:[c.ansW],show:cap(c.ansW),why:possWhy(c.code,c.n[2],c.pl,c.noun)}},
 // A2: de + persona
 de(){const owners=[["Juan"],["Isabel"],["Ana"],["Carlos"],["María"],["el maestro","the teacher (male)"],["la maestra","the teacher (female)"],["los abuelos","the grandparents"],["las chicas","the girls"],["el chico","the boy"],["mi hermano","my brother"]];
  const [o,oen]=R(owners),n=R(THINGS.concat(FAM.slice(0,8))),pl=Math.random()<.3;const noun=pl?n[1]:n[0];
  const deP=o.startsWith("el ")?"del "+o.slice(3):"de "+o;const ans=`${art(n[2],pl,1)} ${noun} ${deP}`;
  const enO=oen||o, enN=pl?n[4]:n[3];
  const plain=(oen||o).replace(/ \(.*\)/,""),tag=oen&&/\(/.test(oen)?oen.match(/\((.*)\)/)[1]+" · ":"";
  const prompt=Math.random()<.5?`the ${enN} of ${plain}`:`${cap(plain)}’s ${enN}`;
  return {sk:"de",type:"type",prompt,hint:`${tag}Use noun + de + person (de + el = del).`,answer:[ans],show:ans,why:o.startsWith("el ")?`de + el always becomes <b>del</b>: ${ans}.`:`Formula: article + noun + de + person → ${ans}.`}},
 // A4: correct the error
 fix(){
  const kinds=[
   ()=>{const f=R(FAM.filter(x=>x[2]&&!["padre","madre"].includes(x[0]))),code=R(["mi","tu","su"]);const right=`${cap(code)} ${f[0]} es simpátic${f[2]==="m"?"o":"a"}.`;return [`${cap(code)}s ${f[0]} es simpátic${f[2]==="m"?"o":"a"}.`,right,`${f[0]} is singular, so use ${code} (no -s).`]},
   ()=>{const t=R(THINGS),code=R(["mi","tu","su"]);const right=`${cap(code)}s ${t[1]} están en la mesa.`;return [`${cap(code)} ${t[1]} están en la mesa.`,right,`${t[1]} is plural, so the possessive needs -s: ${code}s.`]},
   ()=>{const t=R(THINGS.filter(x=>x[2]==="f"&&!["mesa"].includes(x[0]))),nm=R(["Ana","Carlos","Juan"]);return [`El ${t[0]} de ${nm} es grande.`,`La ${t[0]} de ${nm} es grande.`,`${t[0]} is feminine, so it's la ${t[0]}.`]},
   ()=>{const f=R(FAM.filter(x=>!["padre","madre","maestro","maestra","amigo"].includes(x[0])));const o=f[2]==="m"?"nuestro":"nuestra";return [`${cap(o)} ${f[0]} son simpátic${f[2]==="m"?"o":"a"}.`,`${cap(o)} ${f[0]} es simpátic${f[2]==="m"?"o":"a"}.`,`One person → es, not son.`]},
   ()=>{const f=R(FAM.filter(x=>["hermano","primo","tío","abuelo","hijo"].includes(x[0])));return [`Nuestra ${f[0]} es alto.`,`Nuestro ${f[0]} es alto.`,`${f[0]} is masculine, so “our” is nuestro.`]}];
  const [wrong,right,why]=R(kinds)();
  return {sk:"fix",type:"type",prompt:wrong,hint:"Find the mistake. Write the whole corrected sentence.",answer:[right],show:right,why}},
 // C1: hay
 hay(){const n=R(HAYN),mode=R(["a","a","some","num","bare"]);let en,ans,acc;
  if(mode==="a"){en=`There is ${/^[aeiou]/.test(n[3])?"an":"a"} ${n[3]}.`;ans=`Hay ${art(n[2],0,0)} ${n[0]}.`;acc=[ans]}
  else if(mode==="some"){en=`There are some ${n[4]}.`;ans=`Hay ${art(n[2],1,0)} ${n[1]}.`;acc=[ans,`Hay ${n[1]}.`]}
  else if(mode==="num"){const k=R([2,3,4,5]);en=`There are ${["","","two","three","four","five"][k]} ${n[4]}.`;ans=`Hay ${NUMW[k]} ${n[1]}.`;acc=[ans,`Hay ${k} ${n[1]}.`]}
  else{en=`There are ${n[4]}.`;ans=`Hay ${n[1]}.`;acc=[ans,`Hay ${art(n[2],1,0)} ${n[1]}.`]}
  return {sk:"hay",type:"type",prompt:en,hint:"Write it in Spanish with Hay.",answer:acc,show:ans,why:mode==="a"?`There is → Hay + ${art(n[2],0,0)} (${n[0]} is ${n[2]==="m"?"masculine":"feminine"}).`:`There are → Hay + plural. No verb after hay!`}},
 // C2: choose the correct sentence
 haych(){const n=R(HAYN),pl=Math.random()<.5;const right=pl?`Hay ${art(n[2],1,0)} ${n[1]}.`:`Hay ${art(n[2],0,0)} ${n[0]}.`;

  const fin=(ok,given,note)=>{rec(q.sk,ok);if(o.sk2&&o.sk2!==q.sk)rec(o.sk2,ok);if(ok)right++;else missed.push(q);
   fb.innerHTML=`<div class="fb ${ok?"ok":"bad"} pop"><strong>${ok?R(["¡Muy bien!","¡Correcto!","¡Perfecto!","¡Excelente!"]):note&&note.close?"So close!":"Not quite"}</strong>
    ${ok&&q.answer.length===1?"":`<span>Answer: <b>${esc(q.show)}</b></span>`}${note&&note.msg?`<span class="small">${note.msg}</span>`:""}${q.why?`<span class="small">${q.why}</span>`:""}</div>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="nx">${k+1>=qs.length?"Finish":"Next"}</button></div>`;
   nx.onclick=()=>{k++;draw()};nx.focus()};
  if(q.type==="mc")view.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const pick=q.choices[+b.dataset.i],ok=q.answer.includes(pick);
   view.querySelectorAll(".choice").forEach(c=>{c.disabled=true;if(q.answer.includes(q.choices[+c.dataset.i]))c.classList.add("right")});if(!ok)b.classList.add("wrong");fin(ok,pick)});
  else{const inp=document.getElementById("ans");inp.focus();
   view.querySelectorAll(".accents button").forEach(b=>b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+b.dataset.a+inp.value.slice(e);inp.focus();inp.setSelectionRange(s+1,s+1)});
   tf.onsubmit=e=>{e.preventDefault();const v=inp.value;if(!v.trim())return;inp.disabled=true;
    const nv=norm(v),ok=q.answer.some(a=>norm(a)===nv);let note=null;
    if(!ok){const closeA=q.answer.some(a=>noAcc(norm(a))===noAcc(nv));
     if(/\btú\b/.test(nv)&&q.answer.some(a=>/\btus?\b/.test(norm(a))))note={msg:"Possessive <b>tu</b> has no accent. (<b>tú</b> with an accent means “you.”)"};
     else if(/\bde el\b/.test(nv))note={msg:"Remember: de + el = <b>del</b>."};
     else if(/^hay (son|es|están|esta|está)\b/.test(nv))note={msg:"No verb after hay! ❌ Hay son… ✔️ Hay…"};
     else if(closeA)note={close:true,msg:"Check your accents."};}
    fin(ok,v,note)}}
 };
 const finish=()=>{const total=k+(document.getElementById("nx")?1:0)||qs.length;if(o.done)return o.done(right,qs.length,missed);
  S.log.unshift({t:Date.now(),mode:o.title,score:right,total:qs.length});S.log=S.log.slice(0,20);save();
  view.innerHTML=`<section class="card pop"><div class="meta"><span>${esc(o.title)}</span><span>Done</span></div><p class="score">${right} / ${qs.length}</p>
   ${missed.length?`<div><p class="small muted">Review these:</p><ul class="list">${missed.map(q=>`<li>${esc(q.prompt)} → <b>${esc(q.show)}</b></li>`).join("")}</ul></div>`:"<p>¡Perfecto! No mistakes.</p>"}
   <div class="row">${missed.length?`<button class="btn primary" id="rm">Retry my misses</button>`:""}<button class="btn" id="bk">Back</button></div></section>`;
  const rm=document.getElementById("rm");if(rm)rm.onclick=()=>runQs(missed.slice(),o);bk.onclick=o.after};
 draw();
}

/* ================= PRACTICE ================= */
const PR=[["poss","A · Possession","Possessive adjectives","Translate: “our dog,” “my books”…"],["choose","A · Possession","Which possessive?","Read the sentence and pick the right one."],
 ["de","A · Possession","De + persona","“Ana’s cat” → el gato de Ana. Watch for del."],["fix","A · Possession","Correct the error","Find and fix the mistake."],
 ["family","B · Family tree","Family possessives","(her) hijos → sus hijos"],["read","B · Family tree","Reading & family tree","Questions about Clara, Tomás, Julián, and Marta."],
 ["hay","C · Hay","Hay sentences","There is a bed → Hay una cama."],["haych","C · Hay","Which Hay sentence?","Spot the correct sentence."]];
function pracHome(){
 nav("prac");stats();
 view.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px"><section class="card"><h2>Practica</h2><p class="muted">Rounds of 10 with new questions every time. Then try her study guide exercises.</p>
  <div class="row"><button class="btn primary" id="gd">Study guide exercises (A1–C2)</button><button class="btn" id="wk">Practice my weakest skill</button></div></section>
  <div class="grid">${PR.map(([k,tag,n,d])=>`<button class="tile" data-k="${k}"><span class="tag">${tag}</span><span class="name">${n}</span><span class="small muted">${d}</span><div class="mini"><i style="width:${pct(k)}%"></i></div></button>`).join("")}</div></div>`;
 gd.onclick=guideMenu;
 wk.onclick=()=>{const k=PR.map(p=>p[0]).sort((a,b)=>pct(a)-pct(b))[0];startSkill(k)};
 view.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>startSkill(b.dataset.k));
}
function startSkill(k){const name=PR.find(p=>p[0]===k)[2];const qs=k==="read"?shuffle(READQ).slice(0,8).map(q=>Object.assign({},q,{choices:shuffle(q.choices)})):Array.from({length:10},()=>GEN[k]());runQs(qs,{title:name,after:pracHome})}
function guideMenu(){
 nav("prac");const secs=[...new Set(GUIDE.map(q=>q.sec))];
 view.innerHTML=`<section class="card pop"><div class="meta"><span>Study guide exercises</span><span>${GUIDE.length} items</span></div>
  <p>The exact exercises from her study guide, checked against her answer key. Pick a section or do them all.</p>
  <div class="grid">${secs.map(s=>`<button class="tile" data-s="${esc(s)}"><span class="tag">${s.split(" · ")[0]}</span><span class="name" style="font-size:1rem">${esc(s.split(" · ")[1])}</span><span class="small muted">${GUIDE.filter(q=>q.sec===s).length} items</span></button>`).join("")}</div>
  <div class="row"><button class="btn primary" id="all">Do all ${GUIDE.length}</button><button class="btn" id="bk">Back</button></div></section>`;
 all.onclick=()=>runQs(GUIDE.slice(),{title:"Study guide",after:guideMenu});bk.onclick=pracHome;
 view.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>runQs(GUIDE.filter(q=>q.sec===b.dataset.s),{title:b.dataset.s,after:guideMenu}));
}

/* ================= TEST ================= */
function testHome(){
 nav("test");stats();
 view.innerHTML=`<section class="card"><h2>Examen de práctica</h2><p>25 questions covering all three sections, like her quiz: possessive adjectives, de + persona, family possessives, the reading, and Hay. New questions every time.</p>
  <p class="muted small">She sees the right answer after each question and a review list at the end.</p>
  <div class="row"><button class="btn primary" id="go">Start the practice quiz</button>${S.best!==null?`<span class="small muted">Best: <b>${S.best}%</b></span>`:""}</div></section>`;
 go.onclick=()=>{const plan=[["poss",4],["choose",4],["de",3],["fix",2],["family",4],["hay",4],["haych",2]];
  let qs=[];plan.forEach(([k,n])=>{for(let i=0;i<n;i++)qs.push(GEN[k]())});qs=qs.concat(shuffle(READQ).slice(0,2).map(q=>Object.assign({},q,{choices:shuffle(q.choices)})));
  runQs(shuffle(qs),{title:"Practice quiz",noQuit:true,after:testHome,done:(r,t,missed)=>{const p=Math.round(r/t*100);S.best=Math.max(S.best??0,p);S.log.unshift({t:Date.now(),mode:"Practice quiz",score:r,total:t});S.log=S.log.slice(0,20);save();stats();
   const msg=p>=90?"¡Excelente! She's ready for Friday.":p>=80?"Very good. Review the misses below.":p>=65?"Getting there. Practice the weakest skill, then try again.":"Go back to Aprende, then practice each section.";
   view.innerHTML=`<section class="card pop"><div class="meta"><span>Practice quiz</span><span>Results</span></div><p class="score">${r} / ${t}</p><p>${p}% · ${msg}</p>
    ${missed.length?`<div><p class="small muted">Review these:</p><ul class="list">${missed.map(q=>`<li>${esc(q.prompt)} → <b>${esc(q.show)}</b></li>`).join("")}</ul></div>`:""}
    <div class="row">${missed.length?`<button class="btn primary" id="rm">Retry my misses</button>`:""}<button class="btn" id="ag">New quiz</button><button class="btn" id="hm">Home</button></div></section>`;
   const rm=document.getElementById("rm");if(rm)rm.onclick=()=>runQs(missed.slice(),{title:"Retry misses",after:testHome});ag.onclick=testHome;hm.onclick=home}})};
}

/* ================= PROGRESS ================= */
function progress(){
 nav("prog");stats();const f=t=>new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"});
 view.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
  <section class="card"><h2>Skills</h2><p class="small muted">Based on her last 10 answers in each skill.</p>
   <div class="scroll"><table class="wtable"><tbody>${Object.entries(SK).map(([k,n])=>`<tr><td>${n}</td><td style="width:40%"><div class="meter"><i style="width:${pct(k)}%"></i></div></td><td class="num">${S.skills[k].att?pct(k)+"%":"–"}</td><td class="num">${S.skills[k].ok}/${S.skills[k].att}</td></tr>`).join("")}</tbody></table></div></section>
  <section class="card"><h2>Recent rounds</h2>${S.log.length?`<div class="scroll"><table class="wtable"><tbody>${S.log.map(l=>`<tr><td class="num">${f(l.t)}</td><td>${esc(l.mode)}</td><td class="num">${l.score} / ${l.total}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">No rounds yet.</p>`}</section>
  <section class="card"><p class="small muted">Progress is saved in this browser on this device.</p><div id="rs"><button class="btn" id="reset">Reset progress</button></div></section></div>`;
 reset.onclick=()=>{rs.innerHTML=`<div class="confirm"><span>Erase all progress?</span><button class="btn" id="yes">Yes, erase</button><button class="btn" id="no">Cancel</button></div>`;yes.onclick=()=>{S=blank();save();progress()};no.onclick=progress};
}

home();
</script>
