<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olivia's Chapter 3 Math Coach</title><style>
:root{--bg:#f6f5fc;--paper:#fff;--ink:#242343;--sub:#64647c;--purple:#6753c9;--light:#efebff;--mint:#e5f9ed;--green:#16744a;--red:#ad3f51;--line:#e4e2ef}*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:var(--ink);line-height:1.55}header{background:linear-gradient(115deg,#5e50b7,#ad75c5);color:white;padding:28px 20px 38px}main{max-width:1040px;margin:-20px auto 60px;padding:0 16px}.hero{max-width:1040px;margin:auto}h1{font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.1;margin:8px 0}h2{font-size:1.45rem;margin:0 0 10px}h3{font-size:1.12rem;margin:12px 0 6px}p{margin:8px 0 14px}.small{font-size:.87rem;color:var(--sub)}.intro{color:#f4efff}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.tab{border:1px solid #dedaf5;background:white;color:#4a4385;border-radius:14px;padding:11px 14px;font-weight:700;cursor:pointer}.tab.active{background:var(--purple);color:#fff;border-color:var(--purple)}.panel{background:white;border-radius:20px;box-shadow:0 8px 32px #4a397418;padding:clamp(18px,4vw,32px)}.hidden{display:none!important}.pill{display:inline-block;padding:5px 11px;border-radius:99px;background:var(--light);color:#5746ac;font-weight:700;font-size:.8rem}.lessonhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.callout{background:#f5f2ff;border-left:4px solid #8371d8;padding:14px 16px;border-radius:10px;margin:18px 0}.warm{background:#e9f7f1;border-color:#50ae82}.diagram{display:flex;justify-content:center;align-items:center;background:#fbfaff;border:1px solid var(--line);border-radius:16px;padding:8px;margin:14px 0}.diagram svg{width:min(100%,520px);height:auto;max-height:275px}.diagram text{font-family:Arial,sans-serif;font-size:17px;font-weight:bold;fill:#473896}.formula{font-size:1.13rem;font-weight:800;text-align:center;background:#f5f2ff;padding:14px;border-radius:12px}.steps{display:grid;gap:10px;margin:14px 0}.step{border:1px solid var(--line);border-radius:12px;padding:13px 16px}.step b{color:var(--purple)}.qcard{border:1px solid var(--line);border-radius:14px;padding:17px;margin:16px 0}.qcard fieldset{border:0;margin:8px 0;padding:0}.qcard legend{font-weight:700;margin-bottom:8px}.choice{display:block;padding:10px 12px;border:1px solid #dedce8;border-radius:10px;margin:7px 0;cursor:pointer}.choice:has(input:checked){background:#efeaff;border-color:#8878db}.choice input{margin-right:9px;accent-color:#6753c9}.feedback{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f4f3f8;display:none}.feedback.show{display:block}.feedback.good{background:var(--mint);color:#115738}.feedback.bad{background:#fff0f0;color:#8b2d42}button{font:inherit}button.primary,button.secondary{cursor:pointer;border:0;border-radius:11px;padding:11px 17px;font-weight:750;margin:8px 6px 0 0}button.primary{background:var(--purple);color:white}button.secondary{background:#eae7f6;color:#3b3279}.progress{height:10px;background:#e9e6f5;border-radius:10px;overflow:hidden;margin:10px 0 18px}.progress>div{height:100%;background:#49ad89;width:0;transition:width .2s}.sectionmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.results{padding:20px;background:#f5f2ff;border-radius:14px;margin:18px 0}.resultbig{font-size:2.3rem;font-weight:850;color:#5746b0}.source{border-top:1px solid var(--line);margin-top:24px;padding-top:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.topic{background:#f8f7fe;border:1px solid var(--line);border-radius:13px;padding:13px}.topic strong{display:block}a{color:#604eb1}.note{font-size:.88rem;color:var(--sub)}@media(max-width:600px){.panel{padding:17px}.tab{flex:1 1 42%}.diagram svg{max-height:220px}}
</style></head><body><header><div class="hero"><span style="font-weight:700;opacity:.9">YOUR PERSONAL MATH COACH ✨</span><h1>Chapter 3: Angles & Triangles</h1><p class="intro">For Olivia • 8th Grade • Big Ideas Math Blue</p><p class="intro">You don't have to understand it all at once. Learn one idea, try one problem, and build confidence.</p></div></header><main><div class="tabs" id="tabs"></div><section class="panel" id="content"></section></main><script>
const lessons=[
{title:'3.1 • Parallel Lines',short:'Parallel lines',goal:'Recognize angle relationships and find missing angle measures.',lead:'Imagine two train tracks. They never meet: they are parallel. Now imagine a road crossing both tracks—that road is a transversal.',rule:'Corresponding, alternate interior, alternate exterior, and vertical angles are equal (for parallel lines). Angles forming a straight line add to 180°.',visual:'lines',steps:[['Find the matching position','Corresponding angles occupy the same “corner” at both intersections. The teacher calls this the F trick.'],['Look inside the parallel lines','Alternate interior angles make a Z pattern and are equal.'],['Look across an intersection','Vertical angles are opposite one another and are equal.'],['Check if angles add to 180°','A straight line or same-side interior pair is supplementary. Subtract the known angle from 180°.']],example:'If ∠2 = 65°, then ∠6 = 65° (corresponding). ∠1 = 115° because ∠1 and ∠2 form a straight line.',qs:[['The teacher’s F trick helps identify which angles?',['Corresponding angles','Exterior angles only','Triangle sides'],0,'F-shaped pairs are corresponding angles; they are congruent when the lines are parallel.'],['If ∠2 = 72°, what is ∠6?',['108°','72°','18°'],1,'∠2 and ∠6 are corresponding angles, so both measure 72°.'],['If ∠1 = 125°, what is ∠2?',['55°','125°','65°'],0,'They form a straight line: 180 − 125 = 55°.'],['If ∠3 = 48°, what is ∠6?',['132°','48°','90°'],1,'∠3 and ∠6 are alternate interior angles (Z trick), so they match.']]},
{title:'3.2 • Triangle Angles',short:'Triangle angles',goal:'Find missing interior and exterior angles of triangles.',lead:'No matter how tall, flat or tilted a triangle looks, its three inside angles always total 180°.',rule:'Interior angles: A + B + C = 180°. Exterior angle: outside angle = sum of the two nonadjacent inside angles.',visual:'tri',steps:[['Add the two known inside angles','For example, 81° + 25° = 106°.'],['Subtract from 180°','180° − 106° = 74°. The missing angle is 74°.'],['For an outside (exterior) angle','Add the two remote interior angles rather than subtracting from 180°.'],['When you see x','Write an equation first; then solve like normal algebra.']],example:'Teacher’s slide: 81° + 25° + x = 180°, so x = 74°. For a 40° and 30° remote-angle pair, the exterior angle is 70°.',qs:[['A triangle has angles 55°, 65°, and x°. Find x.',['50°','60°','70°'],1,'55 + 65 = 120, and 180 − 120 = 60°.'],['Two remote interior angles are 35° and 75°. What is the exterior angle?',['70°','110°','145°'],1,'Exterior angle = 35° + 75° = 110°.'],['The angles are x°, (x − 35)°, and 43°. What is x?',['86°','94°','104°'],0,'x + x − 35 + 43 = 180 → 2x + 8 = 180 → x = 86°.'],['A triangle has a 90° angle and a 36° angle. What is the last angle?',['54°','64°','44°'],0,'180 − 90 − 36 = 54°.']]},
{title:'3.3 • Polygon Angles',short:'Polygon angles',goal:'Use the polygon formula to find angle sums and missing angles.',lead:'A polygon is a closed figure with straight sides. A triangle has 3, a quadrilateral 4, a pentagon 5, and a hexagon 6.',rule:'Sum of interior angles = (number of sides − 2) × 180°. For a regular polygon, divide the sum by the number of sides to find one interior angle.',visual:'poly',steps:[['Count the sides','A hexagon has 6 sides.'],['Subtract 2','6 − 2 = 4.'],['Multiply by 180°','4 × 180° = 720° total inside the hexagon.'],['Find the missing angle','Subtract all the other interior angles from the total. For a regular polygon, all angles are equal.']],example:'Teacher’s slide: A quadrilateral has angles 90°, 115°, 80°, and x°. Since (4 − 2) × 180 = 360, x = 360 − 285 = 75°.',qs:[['What is the interior angle SUM of a pentagon?',['540°','360°','720°'],0,'(5 − 2) × 180 = 540°.'],['What is the interior angle SUM of a hexagon?',['900°','720°','1080°'],1,'(6 − 2) × 180 = 720°.'],['A quadrilateral has 90°, 115°, 80°, and x°. What is x?',['85°','75°','65°'],1,'360 − (90 + 115 + 80) = 75°.'],['What is ONE interior angle of a regular hexagon?',['120°','60°','720°'],0,'The total is 720°, divided by 6 equal angles = 120°.']]},
{title:'3.4 • Similar Triangles',short:'Similar triangles',goal:'Recognize triangles with the same shape and use matching sides.',lead:'Similar triangles have the same shape, but they might not be the same size. Their corresponding angles match, and their corresponding sides are proportional.',rule:'If two angles of one triangle match two angles of another, the triangles are similar (AA similarity). Matching side lengths must have the same ratio.',visual:'similar',steps:[['Find two matching angles','For example, both triangles have 65° and 95°.'],['Use the third-angle rule','Both third angles must equal 20° because triangle angles add to 180°.'],['Match corresponding sides','Always compare sides opposite equal angles.'],['Write a proportion','For example, 5/10 = 7/x → 5x = 70 → x = 14.']],example:'Teacher’s slide: triangles with angles 65°, 95°, 20° are similar, even when one is drawn larger.',qs:[['Triangle A has angles 65°, 95°, and 20°. Triangle B has 95°, 20°, and 65°. Are they similar?',['Yes','No'],0,'Matching corresponding angles make them similar.'],['Triangle A has 90°, 42°, 48°. Triangle B has 90°, 38°, 52°. Similar?',['Yes','No'],1,'Only the right angles match. The other two do not.'],['A side of 4 on a small triangle matches a side of 12 on a large one. What is the scale factor?',['2','3','4'],1,'12 ÷ 4 = 3.'],['If matching sides are 5 and 10, and another small side is 7, how long is the large matching side?',['12','14','17'],1,'Large/small = 10/5 = 2, so 7 × 2 = 14.']]}
];
const test=[
[0,'Which angles are congruent when parallel lines are cut by a transversal?',['Corresponding angles','Same-side interior angles','All adjacent angles'],0,'Corresponding angles match.'],
[0,'If two supplementary angles include a 37° angle, what is the other?',['143°','53°','37°'],0,'180 − 37 = 143°.'],
[0,'If ∠2 = 118°, what is corresponding ∠6?',['62°','118°','72°'],1,'Corresponding angles are equal.'],
[0,'If ∠2 = 118°, what is adjacent ∠1?',['118°','72°','62°'],2,'180 − 118 = 62°.'],
[0,'Opposite angles at an intersection are called…',['Vertical angles','Exterior angles','Supplementary only'],0,'Vertical angles face each other.'],
[0,'If ∠3 = 49°, what is alternate interior ∠6?',['131°','49°','90°'],1,'Alternate interior angles are equal.'],
[1,'Triangle angles: 30°, 80°, x°. Find x.',['70°','60°','80°'],0,'180 − 30 − 80 = 70°.'],
[1,'Triangle angles: 45°, 45°, x°. Find x.',['45°','90°','100°'],1,'180 − 45 − 45 = 90°.'],
[1,'Remote inside angles are 52° and 41°. Find the exterior angle.',['87°','93°','107°'],1,'52 + 41 = 93°.'],
[1,'Remote inside angles are 60° and 25°. Exterior angle?',['95°','85°','75°'],1,'60 + 25 = 85°.'],
[1,'Triangle angles are x°, x°, and 40°. Find x.',['70°','80°','60°'],0,'2x + 40 = 180; x = 70°.'],
[1,'Triangle angles are x°, (x − 20)°, and 60°. Find x.',['60°','70°','80°'],1,'2x + 40 = 180; x = 70°.'],
[2,'Interior-angle sum of a quadrilateral?',['180°','360°','540°'],1,'(4 − 2) × 180 = 360°.'],
[2,'Interior-angle sum of a pentagon?',['720°','540°','900°'],1,'(5 − 2) × 180 = 540°.'],
[2,'Interior-angle sum of an octagon?',['1080°','900°','1260°'],0,'(8 − 2) × 180 = 1080°.'],
[2,'Which is the correct polygon interior-sum formula?',['n × 180','(n − 2) × 180','(n + 2) × 180'],1,'You subtract two from the number of sides.'],
[2,'Interior angle of a regular pentagon?',['108°','72°','90°'],0,'540 ÷ 5 = 108°.'],
[2,'A quadrilateral has 100°, 80°, 95°, and x°. Find x.',['85°','95°','75°'],0,'360 − (100 + 80 + 95) = 85°.'],
[2,'A polygon has interior sum 900°. How many sides?',['6','7','8'],1,'(n − 2) × 180 = 900, so n − 2 = 5, n = 7.'],
[3,'Two triangles have angles 70°, 60°, 50° and 50°, 70°, 60°. Similar?',['Yes','No'],0,'All corresponding angles match.'],
[3,'Two triangles have angles 90°, 40°, 50° and 90°, 45°, 45°. Similar?',['Yes','No'],1,'One matching angle alone is not enough.'],
[3,'What does AA similarity mean?',['Two matching angles','Two equal sides','All sides equal'],0,'AA means angle-angle similarity.'],
[3,'Small side 3 matches large side 9. Scale factor?',['2','3','6'],1,'9 ÷ 3 = 3.'],
[3,'If small/large corresponding sides are 4/12 and 5/x, find x.',['15','13','20'],0,'4/12 = 5/x, so 4x = 60, x = 15.'],
[3,'If two triangles are similar, matching angles are…',['Supplementary','Congruent','Unrelated'],1,'Corresponding angles are congruent.']
];
const visuals={lines:`<svg viewBox="0 0 480 270" role="img" aria-label="Parallel lines crossed by a diagonal transversal, angles 1 to 8"><g stroke="#423d86" stroke-width="4" fill="none"><path d="M20 90H455 M20 200H455"/><path d="M75 250L365 18" stroke="#df7090"/></g><g><text x="235" y="58">1</text><text x="286" y="66">2</text><text x="235" y="124">3</text><text x="286" y="120">4</text><text x="95" y="166">5</text><text x="149" y="174">6</text><text x="100" y="236">7</text><text x="155" y="233">8</text></g><text x="312" y="251" font-size="14" fill="#726b87">Not to scale</text></svg>`,tri:`<svg viewBox="0 0 480 235" role="img" aria-label="Triangle with angles 81 degrees, 25 degrees and x"><path d="M75 190L140 35L415 190Z" stroke="#6655b8" stroke-width="4" fill="#eeeaff"/><text x="151" y="78">81°</text><text x="355" y="171">25°</text><text x="98" y="175">x°</text><text x="190" y="221" fill="#76708d">Find x</text></svg>`,poly:`<svg viewBox="0 0 480 240" role="img" aria-label="Pentagon and hexagon"><polygon points="126,23 211,83 178,195 74,195 42,83" fill="#ede9ff" stroke="#6553b9" stroke-width="4"/><polygon points="321,30 390,70 390,150 321,190 252,150 252,70" fill="#e3f7ef" stroke="#318b73" stroke-width="4"/><text x="85" y="222">5 sides</text><text x="281" y="222">6 sides</text></svg>`,similar:`<svg viewBox="0 0 480 255" role="img" aria-label="Two similar triangles, one larger than the other"><path d="M26 206L95 63L188 206Z" fill="#e7e3ff" stroke="#6958b7" stroke-width="4"/><path d="M226 206L331 23L462 206Z" fill="#e6f7ef" stroke="#3d987e" stroke-width="4"/><text x="36" y="190">65°</text><text x="90" y="90">95°</text><text x="151" y="194">20°</text><text x="242" y="190">65°</text><text x="319" y="57">95°</text><text x="412" y="194">20°</text></svg>`};
let active='start';const saved=()=>{try{return JSON.parse(localStorage.getItem('oliviaMath3')||'{}')}catch{return {}}};let progress=saved();let choices={};let testChoices={};let testSubmitted=false;function persist(){try{localStorage.setItem('oliviaMath3',JSON.stringify(progress))}catch{}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};function navigate(id){active=id;choices={};testSubmitted=false;render();window.scrollTo({top:0,behavior:'smooth'})}function renderTabs(){document.getElementById('tabs').innerHTML=[['start','Start here'],...lessons.map((x,i)=>['lesson'+i,'Lesson '+(i+1)]),['test','25-question test']].map(([id,t])=>`<button class="tab ${active===id?'active':''}" onclick="navigate('${id}')">${t}${progress[id]==='done'?' ✓':''}</button>`).join('')};function questionHtml(q,key,mode){let [text,opts,correct,explain]=q;return `<div class="qcard" id="q${key}"><fieldset><legend>${esc(text)}</legend>${opts.map((opt,j)=>`<label class="choice"><input type="radio" name="${key}" value="${j}" ${((mode==='test'?testChoices:choices)[key]===j)?'checked':''} onchange="choose('${key}',${j},'${mode}')"> ${esc(opt)}</label>`).join('')}</fieldset>${mode==='learn'?`<button class="primary" onclick="check('${key}',${correct},${JSON.stringify(explain).replace(/"/g,'&quot;')})">Check answer</button>`:''}<div class="feedback" id="f${key}"></div></div>`}function choose(k,j,mode){if(mode==='test')testChoices[k]=j;else choices[k]=j}function check(k,correct,explanation){let box=document.getElementById('f'+k);if(choices[k]===undefined){box.className='feedback show bad';box.textContent='Choose an answer first — guessing is part of learning!';return}let right=choices[k]===correct;box.className='feedback show '+(right?'good':'bad');box.innerHTML=`<strong>${right?'Yes! You got it. 🌟':'Not quite—and that is okay.'}</strong><div>${esc(explanation)}</div>`;progress[k]=right?'right':'review';persist();let pr=document.querySelector('#lessonprogress');if(pr){let n=Object.keys(progress).filter(k=>k.startsWith('l'+active.slice(-1)+'q')&&progress[k]==='right').length;pr.style.width=(n/4*100)+'%'}}function render(){renderTabs();let el=document.getElementById('content');if(active==='start'){let done=lessons.filter((_,i)=>progress['lesson'+i]==='done').length;el.innerHTML=`<span class="pill">NO PRESSURE • ONE STEP AT A TIME</span><h2 style="margin-top:12px">Hi Olivia! You can learn this. 💜</h2><p>Math can feel scary when a chapter has lots of new names. But this chapter is really <strong>four small ideas</strong>. You will see pictures, learn a simple rule, follow a worked example, and practice four questions before moving on.</p><div class="callout warm"><strong>Our rule:</strong> Mistakes are clues, not failures. If you miss a question, read why, then try another one. There's no timer here.</div><div class="sectionmeta"><strong>${done} of 4 lessons marked complete</strong><span class="small">Your lesson progress saves on this device</span></div><div class="progress"><div style="width:${done/4*100}%"></div></div><div class="grid">${lessons.map((l,i)=>`<div class="topic"><strong>${esc(l.title)}</strong><span class="small">${esc(l.goal)}</span><br><button class="secondary" onclick="navigate('lesson${i}')">${progress['lesson'+i]==='done'?'Review':'Learn this'} →</button></div>`).join('')}</div><div class="callout"><strong>Suggested routine:</strong> Learn one lesson (about 15–20 minutes), take a short break, then do its questions. Do the 25-question mock test after all four lessons. Revisit any mistakes with the explanations.</div><button class="primary" onclick="navigate('lesson0')">Start with Lesson 3.1 →</button>`;return}if(active.startsWith('lesson')){let i=Number(active.slice(-1)),l=lessons[i];let right=Array.from({length:4},(_,j)=>progress['l'+i+'q'+j]==='right').filter(Boolean).length;el.innerHTML=`<div class="lessonhead"><span class="pill">LESSON ${i+1} OF 4</span><span class="small">Teacher's Chapter 3 topics</span></div><h2 style="margin-top:12px">${esc(l.title)}</h2><p><strong>Today's goal:</strong> ${esc(l.goal)}</p><div class="callout warm">${esc(l.lead)}</div><div class="diagram">${visuals[l.visual]}</div><h3>⭐ The big idea</h3><div class="formula">${esc(l.rule)}</div><h3>Let's do it step by step</h3><div class="steps">${l.steps.map(([h,d],j)=>`<div class="step"><b>Step ${j+1}: ${esc(h)}</b><div>${esc(d)}</div></div>`).join('')}</div><div class="callout"><strong>Worked example:</strong> ${esc(l.example)}</div><h3>Your turn! Four little wins</h3><p class="small">Try each question, then select “Check answer.” If it is wrong, read the hint and change your answer.</p><div class="progress"><div id="lessonprogress" style="width:${right/4*100}%"></div></div>${l.qs.map((q,j)=>questionHtml(q,'l'+i+'q'+j,'learn')).join('')}<button class="primary" onclick="completeLesson(${i})">Mark lesson complete ✓</button><button class="secondary" onclick="navigate('${i===3?'test':'lesson'+(i+1)}')">${i===3?'Go to mock test':'Next lesson →'}</button><p class="note">You can revisit these explanations whenever you like.</p>`;return}if(active==='test'){renderTest(el)}}function completeLesson(i){progress['lesson'+i]='done';persist();navigate(i===3?'test':'lesson'+(i+1))}function renderTest(el){let n=Object.keys(testChoices).length;el.innerHTML=`<div class="lessonhead"><span class="pill">PRACTICE EXAM</span><span class="small">25 questions • no timer</span></div><h2 style="margin-top:12px">Chapter 3 Mock Test</h2><p>These are <strong>original practice questions</strong> aligned to your teacher's four lessons, not a copy of the school test. Take your time and use scrap paper. When you're finished, get your score and a lesson-by-lesson review.</p><div class="progress"><div style="width:${n/25*100}%"></div></div><p class="small">${n} / 25 answered</p>${test.map((q,j)=>`<div class="qcard"><fieldset><legend>${j+1}. ${esc(q[1])}</legend>${q[2].map((opt,k)=>`<label class="choice"><input type="radio" name="t${j}" ${testChoices['t'+j]===k?'checked':''} onchange="chooseTest(${j},${k})"> ${esc(opt)}</label>`).join('')}</fieldset>${testSubmitted?`<div class="feedback show ${testChoices['t'+j]===q[3]?'good':'bad'}"><b>${testChoices['t'+j]===q[3]?'Correct!':'Correct answer: '+esc(q[2][q[3]])}</b><div>${esc(q[4])}</div></div>`:''}</div>`).join('')}<button class="primary" onclick="submitTest()">${testSubmitted?'Check again':'Grade my test'}</button><button class="secondary" onclick="restartTest()">Start test over</button><div id="testResult">${testSubmitted?resultHtml():''}</div>`}function chooseTest(i,j){testChoices['t'+i]=j;let bar=document.querySelector('.progress>div');if(bar)bar.style.width=(Object.keys(testChoices).length/25*100)+'%'}function submitTest(){if(Object.keys(testChoices).length<25){alert('You have '+(25-Object.keys(testChoices).length)+' question(s) left. Answer all 25 before grading. You can do this!');return}testSubmitted=true;progress.test='done';persist();render()}function restartTest(){if(confirm('Start the test again with all answers cleared?')){testChoices={};testSubmitted=false;render()}}function resultHtml(){let score=test.filter((q,i)=>testChoices['t'+i]===q[3]).length;let section=lessons.map((l,k)=>{let indices=test.map((q,i)=>q[0]===k?i:-1).filter(i=>i>=0),correct=indices.filter(i=>testChoices['t'+i]===test[i][3]).length;return `<div class="topic"><strong>${esc(l.short)}</strong>${correct} / ${indices.length}<p class="small">${correct===indices.length?'Great!':`Review Lesson ${k+1} and retry missed questions.`}</p><button class="secondary" onclick="navigate('lesson${k}')">Review →</button></div>`}).join('');return `<div class="results"><h2>Your results</h2><div class="resultbig">${score} / 25 (${Math.round(score/25*100)}%)</div><p>${score>=23?'Fantastic understanding!':score>=19?'Good progress. Let’s strengthen a few ideas.':'This is useful practice, not a judgment. Review the lessons where you missed questions, then retry.'}</p><div class="grid">${section}</div></div>`}window.navigate=navigate;window.choose=choose;window.check=check;window.completeLesson=completeLesson;window.chooseTest=(i,j)=>{testChoices['t'+i]=j;let bar=document.querySelector('.progress>div');if(bar)bar.style.width=(Object.keys(testChoices).length/25*100)+'%'};window.submitTest=submitTest;window.restartTest=restartTest;render();
</script></body></html>
