c instant, including direction.')],questions:[['Which quantity is a vector?',['Distance','Speed','Displacement','Time'],2,'Displacement has magnitude AND direction.'],['You walk around a track and finish where you started. Your displacement is…',['Zero','Equal to distance','Your speed','Unknown'],0,'Your final and initial positions are the same.'],['What is the origin?',['Total distance traveled','The zero/reference point','A graph line','A force'],1,'The origin is the point used as zero in a coordinate system.'],['Average speed equals…',['Displacement / time','Distance / time','Time / distance','Force / mass'],1,'Speed uses total path distance.'],['A motion diagram shows…',['Only mass','An object’s positions over time','Only direction','Only time'],1,'Dots or snapshots commonly represent positions at equal time intervals.'],['What is the resultant?',['A quantity with no magnitude','The equivalent combined vector','The starting position','Time elapsed'],1,'The resultant summarizes two or more vectors.'],['Instantaneous velocity describes…',['Average motion of the whole trip','Velocity at one instant','Only a distance','Total distance'],1,'Instantaneous means at that moment.']]},

const SUBJECTS=["Science", "History", "Spanish", "English"];const GRADE="8th Grade";const HERO_EMOJI="🕺🎤";const HERO_TEXT="Beat by beat, build your brainpower. Pick a subject and make every practice count!";const SUBJECT_ICONS={Science:'🔬',Physics:'⚛️',History:'🌍',Spanish:'🇪🇸',English:'📖',Precalculus:'📐'};function subjectGroup(s){return s==='Honors Physics'?'Physics':s}
function studentView(){let ms=allmods(student),name=student==='olivia'?'Olivia':'Sophia';let subjects=SUBJECTS;return `${head()}<div class="hero"><div class="spotlight" aria-hidden="true"></div><div class="hero-copy"><span class="pill">${GRADE} • 2026–2027</span><h1>Olivia's<br><span style="color:#f3cb87">Study Central</span> ✨</h1><p class="muted">A Michael Jackson-inspired backstage pass to learning. Pick a subject, practice your moves, and own the stage!</p><div class="mini">★ Learn the steps &nbsp; ★ Master the moves &nbsp; ★ Ace the test</div></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg"><ellipse cx="107" cy="309" rx="76" ry="10" fill="#ba85d9" opacity=".4"/><path d="M80 79 Q106 64 132 81 L152 147 L124 171 L146 272 L128 307 L108 307 L98 204 L85 305 L62 311 L68 262 L72 159 L57 135Z" fill="#0b0b13" stroke="#cb9bf0" stroke-opacity=".65" stroke-width="2"/><path d="M78 92 L51 145 L21 121 L13 132 L53 178 L85 143 M130 91 L166 135 L188 91 L199 96 L183 155 L140 150" fill="none" stroke="#0b0b13" stroke-width="21" stroke-linecap="round"/><path d="M78 92 L51 145 L21 121 M130 91 L166 135 L188 91" fill="none" stroke="#ba8bd1" stroke-width="2" opacity=".65"/><ellipse cx="104" cy="53" rx="25" ry="31" fill="#100c17"/><path d="M71 37 Q76 5 114 15 L148 28 L151 40 L71 46Z" fill="#0b0b12" stroke="#bd91d0" stroke-opacity=".55" stroke-width="2"/><path d="M71 36 Q111 48 156 38" stroke="#e7c88a" stroke-width="5" fill="none"/><path d="M104 86 L113 120 L121 91" fill="none" stroke="#e6cb92" stroke-width="5"/><path d="M52 181 L73 165" stroke="#f5ebff" stroke-width="10" stroke-linecap="round"/><path d="M70 303 L59 316 L92 316 L89 306 M129 305 L123 316 L156 316 L143 304" fill="#e4e1f2"/><text x="9" y="75" fill="#e6c58b" font-size="28">✦</text><text x="168" y="63" fill="#e6c58b" font-size="21">✦</text><text x="162" y="246" fill="#d1a8ec" font-size="24">♫</text></svg></div></div><section class="music-note"><span>🎵</span><div><strong>Ready to rock your next test?</strong><p>Every great performance starts with practice. Flashcards, matching games, and quizzes are your rehearsal! 🎤</p></div><span>✨</span></section><div class="sectionhead"><h2>My subjects</h2><button class="btn small" onclick="nav('add','${student}')">+ Add assignment</button></div><div class="subjectgrid">${subjects.map((sub,i)=>{let count=ms.filter(m=>subjectGroup(m.subject)===sub).length+(EXTERNAL[sub]||[]).length;return `<a class="subjectcard" href="#subject-${i}"><span class="subjecticon">${SUBJECT_ICONS[sub]}</span><strong>${sub}</strong><small>${count?count+' study set'+(count===1?'':'s'):'Ready for your next assignment'}</small></a>`}).join('')}</div><div class="sectionhead"><h2>Tests & assignments</h2></div>${subjects.map((sub,i)=>{let items=ms.filter(m=>subjectGroup(m.subject)===sub);return `<section class="subjectsection" id="subject-${i}"><h3>${SUBJECT_ICONS[sub]} ${sub}</h3>${(items.length||(EXTERNAL[sub]||[]).length)?`<div class="tiles">${items.map(m=>{let b=store.scores[m.id];return `<button class="tile" onclick="nav('module','${student}','${m.id}')"><span style="font-size:31px">${m.emoji||'📝'}</span><span class="pill">${esc(m.subject)}</span><strong>${esc(m.title)}</strong><span class="muted smalltxt">${esc(m.desc||'Custom practice assignment')}</span><span class="foot">${b?'🏆 Best quiz: '+b.best+'/'+b.total+' ('+pct(b.best,b.total)+'%)':'✨ Ready to begin'}</span></button>`}).join('')}${externalTiles(sub)}</div>`:`<div class="empty"><span>📚</span><div><strong>Nothing assigned yet</strong><p>When your next ${sub} test arrives, we'll add the lesson, flashcards, games, and quizzes here.</p></div></div>`}</section>`}).join('')}<div class="note" style="margin-top:22px">💡 To add complete interactive lessons, send ChatGPT your latest site ZIP plus the new study guide or HTML game. Then publish the updated ZIP to this same Netlify site. The quick “Add assignment” button makes personal vocabulary decks in this browser only.</div>`}
function addView(){let n=student==='olivia'?'Olivia':'Sophia';return `${head()}<div class="breadcrumbs"><button class="link" onclick="goHome()">My Study Central</button> / <button class="link" onclick="nav('student','${student}')">${n}</button> / Add assignment</div><div class="card"><h2>➕ Add an assignment for ${n}</h2><p class="muted">Create a simple vocabulary deck and automatically get a repeatable practice quiz. You can add more terms later by updating the HTML with ChatGPT.</p><form class="stack" onsubmit="addModule(event)"><label>Subject<input class="field" name="subject" required maxlength="60" placeholder="e.g. Biology"></label><label>Test or assignment title<input class="field" name="title" required maxlength="90" placeholder="e.g. Chapter 5 Vocabulary"></label><label>Terms and definitions <span class="muted smalltxt">(one per line, separate using |)</span><textarea class="field" name="terms" rows="9" required placeholder="Gravity | A force that attracts objects toward each other&#10;Friction | A force that opposes motion&#10;Mass | The amount of matter in an object"></textarea></label><button class="btn" type="submit">Create assignment ✨</button></form></div>`}
function addModule(e){e.preventDefault();let f=new FormData(e.target),cards=String(f.get('terms')).split('\n').map(s=>s.split('|')).filter(a=>a.length>=2&&a[0].trim()&&a.slice(1).join('|').trim()).map(a=>({term:a[0].trim(),definition:a.slice(1).join('|').trim()}));if(cards.length<2){alert('Add at least two term | definition lines.');return}let id='custom-'+Date.now(),m={id,owner:student,subject:String(f.get('subject')).trim(),title:String(f.get('title')).trim(),emoji:'📝',desc:cards.length+' study terms',lessons:[],cards,questions:[]};store.custom.push(m);save();nav('module',student,id)}
function moduleView(){if(!mod)return studentView();let b=store.scores[mod.id];return `${head()}<div class="breadcrumbs"><button class="link" onclick="goHome()">My Study Central</button> / <button class="link" onclick="nav('student','${student}')">${student==='olivia'?'Olivia':'Sophia'}</button> / ${esc(mod.subject)}</div><div class="hero"><span class="pill">${esc(mod.subject)}</span><h1>${mod.emoji||'📝'} ${esc(mod.title)}</h1><p class="muted">${esc(mod.desc||'Practice makes progress!')}</p>${b?`<div class="pill">🏆 Best quiz score: ${b.best}/${b.total} · ${b.attempts} attempt${b.attempts===1?'':'s'}</div>`:''}</div><div class="toolbar tabs">${[['learn','📖 Learn'],['cards','🧠 Flashcards'],['match','🎮 Match'],['quiz','✅ Practice quiz'],['progress','📈 Progress']].map(x=>`<button class="tab ${tab===x[0]?'active':''}" onclick="setTab('${x[0]}')">${x[1]}</button>`).join('')}</div><section class="content">${tab==='learn'?learn():tab==='cards'?cards():tab==='match'?match():tab==='quiz'?quizView():progressView()}</section>`}
function setTab(t){tab=t;index=0;flipped=false;selected=null;answered=false;matchPairs=[];matchPicked=[];matchSel=null;if(t==='quiz')startQuiz();if(t==='match')startMatch();render()}
function learn(){if(!mod.lessons.length)return `<h2>📖 Start with the key ideas</h2><p>This assignment has ${mod.cards.length} terms. Review the definitions below, then use flashcards, matching, and the quiz to practice.</p>${mod.cards.map((c,i)=>`<div class="topic"><strong>${i+1}. ${esc(c.term)}</strong>${esc(c.definition)}</div>`).join('')}`;return `<h2>📖 Learn it in small steps</h2><p class="muted">Read one idea at a time. When you're ready, try the games and quiz.</p>${mod.lessons.map((a,i)=>`<div class="topic"><strong>Step ${i+1}: ${esc(a[0])}</strong><p>${esc(a[1])}</p><p class="smalltxt"><strong>💡 Example:</strong> ${esc(a[2])}</p></div>`).join('')}<button class="btn" onclick="setTab('cards')">Ready? Try flashcards →</button>`}
function cards(){let c=mod.cards[index];return `<h2>🧠 Flashcards</h2><p class="muted">Say the answer out loud, then tap to flip. You can cycle through every card.</p><div class="row"><span class="stat">Card ${index+1} of ${mod.cards.length}</span></div><div class="progress"><div class="bar" style="width:${pct(index+1,mod.cards.length)}%"></div></div><button class="flash ${flipped?'flipped':''}" onclick="flipped=!flipped;render()"><div><div class="smalltxt muted">${flipped?'DEFINITION':'TERM'} · TAP TO FLIP</div>${esc(flipped?c.definition:c.term)}</div></button><div class="toolbar"><button class="btn alt" onclick="index=(index-1+mod.cards.length)%mod.cards.length;flipped=false;render()">← Previous</button><button class="btn" onclick="index=(index+1)%mod.cards.length;flipped=false;render()">Next →</button><button class="btn alt" onclick="index=0;flipped=false;render()">Start over ↺</button></div>`}
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);function startMatch(){matchPairs=shuffle(mod.cards.map((c,i)=>({i,...c}))).slice(0,Math.min(6,mod.cards.length));matchPicked=[];matchSel=null}function match(){let right=shuffle(matchPairs).map(c=>c);if(!window._matchRight||window._matchId!==mod.id+'-'+matchPairs.map(p=>p.i).join(',')){window._matchRight=right;window._matchId=mod.id+'-'+matchPairs.map(p=>p.i).join(',')}right=window._matchRight;let complete=matchPicked.length===matchPairs.length;return `<h2>🎮 Matching game</h2><p class="muted">Pick a term, then its definition. Match all ${matchPairs.length} pairs!</p><p class="stat">✅ ${matchPicked.length} of ${matchPairs.length} matched</p><div class="matchgrid"><div class="matchcol"><strong>Terms</strong>${matchPairs.map(c=>`<button class="match ${matchPicked.includes(c.i)?'matched':matchSel===c.i?'selected':''}" ${matchPicked.includes(c.i)?'disabled':''} onclick="matchSel=${c.i};render()">${esc(c.term)}</button>`).join('')}</div><div class="matchcol"><strong>Definitions</strong>${right.map(c=>`<button class="match ${matchPicked.includes(c.i)?'matched':''}" ${matchPicked.includes(c.i)?'disabled':''} onclick="checkMatch(${c.i})">${esc(c.definition)}</button>`).join('')}</div></div>${complete?'<p class="feedback">🎉 Perfect match! Great job.</p>':''}<div class="toolbar"><button class="btn" onclick="startMatch();window._matchId='';render()">Play again ↺</button></div>`}function checkMatch(id){if(matchSel===null){alert('First choose a term on the left.');return}if(matchSel===id){matchPicked.push(id);matchSel=null;render()}else{matchSel=null;render();alert('Not quite! Try another pair.')}}
function startQuiz(){let q=mod.questions.length?mod.questions.map(a=>({prompt:a[0],options:[...a[1]],correct:a[2],explain:a[3]})):mod.cards.map((c,i)=>{let wrong=shuffle(mod.cards.filter((x,j)=>j!==i)).slice(0,3).map(x=>x.definition),options=shuffle([c.definition,...wrong]);return {prompt:'What does “'+c.term+'” mean?',options,correct:options.indexOf(c.definition),explain:c.definition}});quiz=shuffle(q);qi=0;answered=false;selected=null;window._score=0;window._complete=false}function choose(a){if(answered)return;selected=a;answered=true;if(a===quiz[qi].correct)window._score++;render()}function nextQ(){if(qi+1===quiz.length){let old=store.scores[mod.id]||{best:0,attempts:0,total:quiz.length};old.best=Math.max(old.best,window._score);old.attempts++;old.total=quiz.length;old.last=window._score;store.scores[mod.id]=old;save();window._complete=true}else{qi++;selected=null;answered=false}render()}function quizView(){if(!quiz.length)startQuiz();if(window._complete)return `<h2>🎉 Quiz complete!</h2><h1>${window._score} / ${quiz.length} correct</h1><p>${pct(window._score,quiz.length)}% · ${pct(window._score,quiz.length)>=80?'Amazing work!':'Every try helps you learn. Keep practicing!'}</p><div class="progress"><div class="bar" style="width:${pct(window._score,quiz.length)}%"></div></div><div class="toolbar"><button class="btn" onclick="startQuiz();render()">Try again ↺</button><button class="btn alt" onclick="setTab('progress')">See progress →</button></div>`;let q=quiz[qi];return `<h2>✅ Practice quiz</h2><div class="row"><span class="stat">Question ${qi+1} of ${quiz.length}</span><span class="muted">Score so far: ${window._score}</span></div><div class="progress"><div class="bar" style="width:${pct(qi,quiz.length)}%"></div></div><h3 style="margin-top:20px">${esc(q.prompt)}</h3><div class="answers">${q.options.map((o,i)=>`<button class="answer ${answered?(i===q.correct?'correct':i===selected?'wrong':''):''}" onclick="choose(${i})" ${answered?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${answered?`<div class="feedback">${selected===q.correct?'✅ You got it!':'💡 Good try!'} ${esc(q.explain)}</div><div class="toolbar"><button class="btn" onclick="nextQ()">${qi===quiz.length-1?'See my score':'Next question →'}</button></div>`:''}`}
function progressView(){let b=store.scores[mod.id];return `<h2>📈 Your progress</h2>${b?`<div class="grid"><div class="topic"><strong>🏆 Best score</strong><h1>${b.best}/${b.total}</h1>${pct(b.best,b.total)}% correct</div><div class="topic"><strong>🔁 Total quiz attempts</strong><h1>${b.attempts}</h1>Last score: ${b.last}/${b.total}</div></div><div class="progress"><div class="bar" style="width:${pct(b.best,b.total)}%"></div></div>`:'<p class="muted">No quiz score yet. Finish a practice quiz to see how much you know!</p>'}<p class="note">🔒 Progress stays on this device and browser only. It does not automatically sync to other devices; clearing browser data may erase it.</p><button class="btn" onclick="setTab('quiz')">${b?'Beat your best score':'Start your first quiz'} →</button>`}
function render(){app.innerHTML=(page==='home'?studentView():page==='student'?studentView():page==='add'?addView():moduleView())+`<div class="footer">Made for Olivia 💜 · 2026–2027 · Study Central</div>`}render();
</script></body></html>
