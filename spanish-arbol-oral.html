<title>Mi Árbol: Práctica Oral</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: one narrow study column, sticky section tabs, a day-strip of the Hours on Home */
:root{
  --bg:#f1f5ec; --surface:#ffffff; --ink:#1f2a1c; --muted:#5b6656; --line:#d6e0cf;
  --accent:#2e6b34; --accent-soft:#deeedb; --gold:#b5562a; --gold-soft:#f9e6da;
  --good:#1f7a4d; --good-soft:#dcf1e5; --bad:#b03a3a; --bad-soft:#f8e0e0;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12162a; --surface:#1b2140; --ink:#e8ebf7; --muted:#a3aac6; --line:#2e3660;
  --accent:#9eaeff; --accent-soft:#283166; --gold:#e3b75c; --gold-soft:#3a3120;
  --good:#6fd39f; --good-soft:#173a2a; --bad:#f08c8c; --bad-soft:#432222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12162a; --surface:#1b2140; --ink:#e8ebf7; --muted:#a3aac6; --line:#2e3660;
  --accent:#9eaeff; --accent-soft:#283166; --gold:#e3b75c; --gold-soft:#3a3120;
  --good:#6fd39f; --good-soft:#173a2a; --bad:#f08c8c; --bad-soft:#432222; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:760px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.tab{flex:0 0 auto;border:0;background:none;color:var(--muted);font:600 15px var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.tab[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
main{max-width:760px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,44px)} h2{font-size:26px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
p{margin:0}.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.hour{padding:12px 10px;display:grid;gap:2px;font-size:13px;color:var(--ink)}
.hour b{font-size:14px}
.h1{background:var(--gold-soft)}.h2{background:var(--surface)}.h3{background:var(--accent-soft)}.h4{background:var(--bg)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:16px;cursor:pointer;display:grid;gap:6px;font:inherit}
.mode:hover{border-color:var(--accent)}
.mode .t{font-weight:800;font-size:17px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:10px;padding:11px 18px;font:700 16px var(--body);cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,.mode:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.q{font-size:20px;font-weight:600}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--accent);text-align:center;padding:0 6px;color:var(--accent)}
.blank.ok{color:var(--good);border-color:var(--good)}.blank.no{color:var(--bad);border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 16px var(--body);cursor:pointer}
.chip:disabled{cursor:default;opacity:.55}
.chip.ok{background:var(--good-soft);border-color:var(--good);color:var(--good);opacity:1}
.chip.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);opacity:1}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px 14px;font:600 16px var(--body);cursor:pointer;display:flex;gap:10px}
.opt .k{font-weight:800;color:var(--muted)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px}
.fb.ok{background:var(--good-soft);color:var(--good)}.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb span{color:var(--ink);font-weight:400}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:12px;font:16px var(--body);background:var(--bg);color:var(--ink);resize:vertical}
.sample{border-left:4px solid var(--gold);background:var(--gold-soft);padding:12px 14px;border-radius:0 10px 10px 0}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font-size:14px;font-weight:700;padding:4px 10px;border-radius:99px}
.key.hit{background:var(--good-soft);color:var(--good)}.key.miss{background:var(--bad-soft);color:var(--bad)}
.facts{display:grid;gap:10px}
.fact{border-bottom:1px solid var(--line);padding-bottom:10px;display:grid;gap:2px}
.fact:last-child{border:0;padding:0}
.fact b{color:var(--accent)}
.score{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.speak{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 10px;font:600 13px var(--body);cursor:pointer}
@media (max-width:480px){.hours{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .25s ease}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
.mlist{display:grid;gap:8px;counter-reset:none}
.mdef{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.mdef .k{font-weight:800;color:var(--gold);min-width:18px}
.mrow{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px}
.mrow.ok{background:var(--good-soft);border-color:var(--good)}.mrow.no{background:var(--bad-soft);border-color:var(--bad)}
.mrow .term{font-weight:700}
.letters{display:flex;gap:6px;flex-wrap:wrap}
.letter{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:800 16px var(--body);cursor:pointer}
.letter[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.letter:disabled{cursor:default}
.letter:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:first-child{font-weight:700;color:var(--accent)}
.works{display:grid;grid-template-columns:repeat(7,1fr);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.work{padding:10px 6px;font-size:12.5px;font-weight:700;text-align:center;display:grid;gap:4px;align-content:start}
.work span{font-size:22px}
.work:nth-child(odd){background:var(--gold-soft)}.work:nth-child(even){background:var(--accent-soft)}
@media (max-width:600px){.works{grid-template-columns:repeat(4,1fr)}table.t{font-size:14px}}
.tree{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.tree img{display:block;width:100%;height:auto}
.hot{position:absolute;border:0;background:transparent;border-radius:10px;cursor:pointer;padding:0}
.hot:hover{background:rgba(255,255,255,.18);outline:3px solid var(--accent)}
.hot.on{outline:4px solid var(--gold);background:rgba(255,200,120,.22);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}
.hot .nm{position:absolute;left:0;right:0;bottom:-2px;font:800 clamp(7px,1.3vw,13px) var(--body);color:#1f2a1c;text-align:center;white-space:nowrap;overflow:hidden}
.say{font-size:22px;font-weight:700;color:var(--accent)}
.en{color:var(--muted);font-size:15px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--gold);color:#fff;font-size:34px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.mic.rec{animation:rec 1s ease-in-out infinite;background:var(--bad)}
@keyframes rec{50%{transform:scale(1.08)}}
.heard{font-style:italic}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.vbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:600 16px var(--body);cursor:pointer}
.vbtn small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.names label{display:grid;gap:4px;font-size:14px;font-weight:700;color:var(--muted)}
.names input{font:16px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.script p{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.script p:last-child{border:0}
.toggle{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:700;color:var(--muted)}
td .speak{margin-left:4px}
</style>

function pickVoice(){try{const v=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));

try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function speak(t,lang){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
  if(lang==="en"){u.lang="en-US";}else{u.lang=VOICE?VOICE.lang:"es-MX";if(VOICE)u.voice=VOICE;}
  u.rate=S.slow?.65:.9;speechSynthesis.speak(u);}catch(e){}}
const sb=(t,label)=>`<button class="speak" data-say="${esc(t)}" aria-label="Listen: ${esc(t)}">🔊${label===""?"":" "+(label||"Escuchar")}</button>`;
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b)speak(b.dataset.say,b.dataset.lang);});

// Speech recognition
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(onText,onEnd){
  if(!SR){onEnd&&onEnd("nosupport");return null;}
  const r=new SR();r.lang=VOICE&&/es-ES/i.test(VOICE.lang)?"es-ES":"es-MX";r.interimResults=false;r.maxAlternatives=5;
  let got=false;
  r.onresult=e=>{got=true;const alts=[...e.results[0]].map(a=>a.transcript);onText(alts);};
  r.onerror=e=>{onEnd&&onEnd(e.error||"error");};
  r.onend=()=>{if(!got)onEnd&&onEnd("nothing");};
  try{r.start();}catch(e){onEnd&&onEnd("error");}
  return r;
}

   return `<button class="hot${on?" on":""}" data-p="${p.id}" style="left:${x/15.36}%;top:${y/10.24}%;width:${w/15.36}%;height:${h/10.24}%" aria-label="${p.w}">${showNames&&p.id!=="perro"?`<span class="nm">${esc(nm(p.id))}</span>`:""}</button>`;}).join("")}</div>`;
}
function sentenceFor(id){
  const p=P[id];if(id==="yo")return `Yo me llamo ${nm("yo")}.`;
  if(id==="perro")return `Nuestro perro se llama ${nm("perro")}.`;
  return `${p.g==="m"?"Él":"Ella"} es mi ${p.w}. Se llama ${nm(id)}.`;
}

// ---------- QUESTION BANKS ----------
const OWNERS=[["my","mi"],["your","tu"],["his","su"],["her","su"],["their","su"],["our","nuestro"],["your (you all)","vuestro"]];
const PRON=[["yo","mi"],["tú","tu"],["él","su"],["ella","su"],["usted","su"],["nosotros","nuestro"],["nosotras","nuestro"],["vosotros","vuestro"],["vosotras","vuestro"],["ellos","su"],["ellas","su"],["ustedes","su"]];
const NOUNS=[["abuelo","m","grandfather"],["abuela","f","grandmother"],["abuelos","mp","grandparents"],["tío","m","uncle"],["tía","f","aunt"],["tíos","mp","aunts and uncles"],["tías","fp","aunts"],["primo","m","cousin (boy)"],["prima","f","cousin (girl)"],["primos","mp","cousins"],["primas","fp","cousins (girls)"],["hermano","m","brother"],["hermana","f","sister"],["hermanos","mp","siblings"],["hermanas","fp","sisters"],["padres","mp","parents"],["perro","m","dog"],["familia","f","family"]];
function possForm(code,g){const pl=g.endsWith("p"),f=g[0]==="f";
  if(code==="nuestro"||code==="vuestro")return code.slice(0,-1)+(f?"a":"o")+(pl?"s":"");return code+(pl?"s":"");}
function phrase(){const [en,code]=R(OWNERS),[n,g,ne]=R(NOUNS);return {es:possForm(code,g)+" "+n,en:en+" "+ne};}

// ---------- LISTEN ----------
let L=null;
function listenMode(){L={n:0,ok:0};nextListen();}
function nextListen(){
  if(L.n>=10){$("#app").innerHTML=`<div class="panel" style="text-align:center;justify-items:center"><span class="eyebrow">Escucha complete</span><div class="score">${L.ok} / 10</div><div class="row" style="justify-content:center"><button class="btn" onclick="listenMode()">Again</button><button class="btn ghost" onclick="nav('speak')">Next: Habla</button></div></div>`;return;}
  const a=phrase();const opts=new Set([a.en]);let guard=0;
  while(opts.size<4&&guard++<50){const b=Math.random()<.6?{en:R(OWNERS)[0]+" "+a.en.split(" ").slice(1).join(" ")}:phrase();opts.add(b.en);}
  // avoid ambiguous his/her/their duplicates for su
  const list=shuffle([...opts]);
  $("#app").innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="eyebrow">Escucha · ${L.n+1} of 10</span>${slowToggle()}</div>
  <p class="q">Listen. What does it mean?</p><p class="muted" style="font-size:14px">Listen for the <b>-s</b>: it tells you if there is 1 or more than one.</p>
  <div class="row"><button class="btn" data-say="${esc(a.es)}">🔊 Play</button></div>
  <div class="opts" id="opts">${list.map((o,i)=>`<button class="opt" data-o="${esc(o)}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div><div id="fb"></div></div>`;
  setTimeout(()=>speak(a.es),300);
  const ok=o=>o===a.en||(a.es.startsWith("su")&&/^(his|her|their)/.test(o)&&o.split(" ").slice(1).join(" ")===a.en.split(" ").slice(1).join(" "));
  $("#opts").onclick=e=>{const b=e.target.closest(".opt");if(!b)return;const good=ok(b.dataset.o);
    document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(ok(x.dataset.o))x.classList.add("ok");});if(!good)b.classList.add("no");
    L.n++;if(good)L.ok++;
    $("#fb").innerHTML=`<div class="fb ${good?"ok":"no"}"><b>${good?"¡Correcto!":"Not quite."}</b> <span>“${esc(a.es)}” = ${esc(a.en)}${a.es.startsWith("su")?" (su/sus can mean his, her, or their)":""}.</span></div><div class="row" style="margin-top:10px"><button class="btn" id="nb" onclick="nextListen()">Next</button></div>`;$("#nb").focus();};
}

// ---------- SPEAK (English → Spanish) ----------
let SP=null;
function speakMode(){SP={n:0,ok:0};nextSpeak();}
function speakItems(){
  const r=Math.random();
  if(r<.35){const [pr,code]=R(PRON),[n,g,ne]=R(NOUNS.filter(x=>x[0]!=="familia"));const pl=g.endsWith("p");
    return {prompt:`Owner: <b>${pr}</b> · Owned: <b>${pl?"2 or more":"1"} · ${n}</b> (${ne})<br><span class="muted" style="font-size:15px">Say the possessive + the noun.</span>`,ans:possForm(code,g)+" "+n,keys:[possForm(code,g)+" "+n]};}
  if(r<.7){const a=phrase();return {prompt:`Say in Spanish: <b>${esc(a.en)}</b>`,ans:a.es,keys:[a.es]};}
  const fixed=[
   ["My grandmother's name is "+nm("aba1")+".",`Mi abuela se llama ${nm("aba1")}.`,["mi abuela se llama"]],
   ["They are my cousins.","Ellos son mis primos.",["son mis primos"]],
   ["She is my aunt.","Ella es mi tía.",["es mi tia"]],
   ["He is my uncle.","Él es mi tío.",["es mi tio"]],
   ["Our dog's name is "+nm("perro")+".",`Nuestro perro se llama ${nm("perro")}.`,["nuestro perro se llama"]],
   ["Our family is big.","Nuestra familia es grande.",["nuestra familia"]],
   ["My parents are "+nm("papa")+" and "+nm("mama")+".",`Mis padres son ${nm("papa")} y ${nm("mama")}.`,["mis padres"]],
   ["They are my grandparents.","Ellos son mis abuelos.",["son mis abuelos"]],
   ["My brother's name is "+nm("her")+".",`Mi hermano se llama ${nm("her")}.`,["mi hermano se llama"]],
   ["My cousin has a dog. Her dog is small.","Mi prima tiene un perro. Su perro es pequeño.",["su perro"]],
   ["Is she your sister?","¿Es tu hermana?",["tu hermana"]]
  ];const f=R(fixed);return {prompt:`Say in Spanish: <b>${esc(f[0])}</b>`,ans:f[1],keys:f[2]};
}
function nextSpeak(){
  if(SP.n>=8){$("#app").innerHTML=`<div class="panel" style="text-align:center;justify-items:center"><span class="eyebrow">Habla complete</span><div class="score">${SP.ok} / 8</div><div class="row" style="justify-content:center"><button class="btn" onclick="speakMode()">Again</button><button class="btn ghost" onclick="nav('oral')">Next: Quiz oral</button></div></div>`;return;}
  const it=speakItems();
  askUI({eyebrow:`Habla · ${SP.n+1} of 8`,prompt:it.prompt,ans:it.ans,keys:it.keys,hi:null,
    done:ok=>{SP.n++;if(ok)SP.ok++;nextSpeak();}});
}

// ---------- ORAL QUIZ (teacher asks in Spanish) ----------
let OQ=null;
function oral(){OQ={n:0,ok:0};nextOral();}
function oralItem(){
  const ppl=PEOPLE.filter(p=>!["yo","perro"].includes(p.id));
  const kinds=[
   ()=>{const p=R(ppl);return {q:"¿Quién es?",hi:[p.id],ans:`${p.g==="m"?"Él":"Ella"} es mi ${p.w}.`,keys:[`mi ${p.w}`],no:[`mis ${p.w}`]};},
   ()=>{const p=R(ppl);return {q:`¿Cómo se llama tu ${p.w}?`,hi:[p.id],ans:`Mi ${p.w} se llama ${nm(p.id)}.`,keys:[`mi ${p.w}`,"se llama"]};},
   ()=>{const g=R(GROUPS);return {q:`¿Quiénes son ${g.pro}?`,hi:g.ids,ans:`${cap(g.pro)} son mis ${g.w}.`,keys:[`mis ${g.w}`]};},
   ()=>{const p=R(ppl);const same=Math.random()<.5;const other=R(ppl.filter(x=>x.w!==p.w));const asked=same?p:other;
     return {q:`¿Es tu ${asked.w}?`,hi:[p.id],ans:same?`Sí, es mi ${p.w}.`:`No, es mi ${p.w}.`,keys:[same?"si":"no",`mi ${p.w}`]};},
   ()=>({q:"¿Cómo se llama el perro de tu familia?",hi:["perro"],ans:`Nuestro perro se llama ${nm("perro")}.`,keys:["nuestro perro"]}),
   ()=>{const g=R(GROUPS.filter(g=>["abuelos","primos","tíos"].includes(g.w)));return {q:`¿Son sus ${g.w} o tus ${g.w}?`,hi:g.ids,ans:`Son mis ${g.w}.`,keys:[`mis ${g.w}`]};},
   ()=>({q:"¿Cómo se llaman tus padres?",hi:["papa","mama"],ans:`Mis padres se llaman ${nm("papa")} y ${nm("mama")}.`,keys:["mis padres","se llaman"]}),
   ()=>({q:"¿Cómo te llamas?",hi:["yo"],ans:`Me llamo ${nm("yo")}.`,keys:["me llamo"]})
  ];
  return R(kinds)();
}
function nextOral(){
  if(OQ.n>=10){$("#app").innerHTML=`<div class="panel" style="text-align:center;justify-items:center"><span class="eyebrow">Quiz oral complete</span><div class="score">${OQ.ok} / 10</div><p class="muted">${OQ.ok>=9?"¡Excelente! You're ready.":OQ.ok>=7?"¡Muy bien! Practice the ones you missed.":"Keep practicing. Review Aprende, then try again."}</p><div class="row" style="justify-content:center"><button class="btn" onclick="oral()">Again</button><button class="btn ghost" onclick="nav('script')">Mi presentación</button></div></div>`;return;}
  const it=oralItem();
  askUI({eyebrow:`Quiz oral · ${OQ.n+1} of 10`,prompt:`<span class="say">${esc(it.q)}</span>`,askAudio:it.q,ans:it.ans,keys:it.keys,hi:it.hi,
    hint:"Answer in a full sentence. The person is highlighted on the tree.",done:ok=>{OQ.n++;if(ok)OQ.ok++;nextOral();}});
}

// ---------- SHARED ASK UI ----------
let REC=null;function stopRec(){try{REC&&REC.abort();}catch(e){}REC=null;}
function askUI(o){
  $("#app").innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="eyebrow">${o.eyebrow}</span>${slowToggle()}</div>
   ${o.hi?treeHTML(o.hi,false):""}
   <p class="q">${o.prompt}</p>${o.askAudio?`<div>${sb(o.askAudio,"Hear the question")}</div>`:""}
   ${o.hint?`<p class="muted" style="font-size:14px">${o.hint}</p>`:""}
   <div class="row" style="gap:16px"><button class="mic" id="mic" aria-label="Tap and speak">🎤</button><span class="muted" id="st">${SR?"Tap the mic and say your answer.":"Say your answer out loud, then tap “Show answer.”"}</span></div>
   <div class="row"><button class="btn ghost" id="show">Show answer</button></div>
   <div id="fb"></div></div>`;
  if(o.askAudio)setTimeout(()=>speak(o.askAudio),350);
  const finish=(ok,heard)=>{stopRec();S.score.tries++;if(ok)S.score.ok++;save();
    $("#mic").disabled=true;$("#show").disabled=true;
    $("#fb").innerHTML=`${heard!=null?`<p class="heard">I heard: “${esc(heard)}”</p>`:""}
     <div class="fb ${ok?"ok":"no"}"><b>${ok?"¡Muy bien!":"Listen and repeat:"}</b> <span>${esc(o.ans)}</span></div>
     <div class="row" style="margin-top:10px">${sb(o.ans,"Hear it")}<button class="btn" id="nb">Next</button></div>`;
    speak(o.ans);$("#nb").onclick=()=>o.done(ok);};
  const check=alts=>{const good=alts.find(a=>o.keys.every(k=>norm(a).includes(norm(k))));return good;};
  $("#mic").onclick=()=>{
    if(!SR){$("#st").textContent="The mic doesn't work in this browser. Say it out loud, then tap “Show answer.”";return;}
    stopRec();try{speechSynthesis.cancel();}catch(e){}
    $("#mic").classList.add("rec");$("#st").textContent="Listening… speak now.";
    REC=listen(alts=>{$("#mic").classList.remove("rec");const g=check(alts);
      if(g)finish(true,g);else{$("#st").innerHTML=`I heard: “<i>${esc(alts[0])}</i>”. Try again, or tap “Show answer.”`;}},
      err=>{$("#mic").classList.remove("rec");
      $("#st").textContent=err==="not-allowed"||err==="service-not-allowed"?"Microphone is blocked. Allow it in the browser, or say it out loud and tap “Show answer.”":"I didn't catch that. Tap the mic and try again.";});
  };
  $("#show").onclick=()=>{stopRec();
    $("#fb").innerHTML=`<div class="sample"><b>Answer:</b> ${esc(o.ans)} ${sb(o.ans,"Hear it")}</div>
     <p style="font-weight:700;margin-top:10px">Did you say it right?</p>
     <div class="row"><button class="btn" id="y">Yes</button><button class="btn ghost" id="n">Not yet</button></div>`;
    speak(o.ans);$("#y").onclick=()=>finish(true,null);$("#n").onclick=()=>finish(false,null);};
}

// ---------- SCRIPT ----------
function scriptLines(){
  const tios=["tio1","tia1","tio2","tia2","tio3"],prims=["pri1","pra1","pri2","pra2","pri3","pra3"];
  const list=ids=>{const n=ids.map(nm);return n.slice(0,-1).join(", ")+" y "+n[n.length-1];};
  return [
   ["Hola, me llamo "+nm("yo")+". Este es mi árbol genealógico.","Hi, my name is ___. This is my family tree."],
   [`Ellos son mis abuelos. Mi abuelo se llama ${nm("abu1")} y mi abuela se llama ${nm("aba1")}.`,"They are my grandparents."],
   [`Ellos también son mis abuelos. Se llaman ${nm("abu2")} y ${nm("aba2")}.`,"They are also my grandparents."],
   [`Él es mi papá. Se llama ${nm("papa")}. Ella es mi mamá. Se llama ${nm("mama")}.`,"He is my dad. She is my mom."],
   [`Ellos son mis padres.`,"They are my parents."],
   [`Tengo un hermano y una hermana. Mi hermano se llama ${nm("her")} y mi hermana se llama ${nm("hra")}.`,"I have a brother and a sister."],
   [`Ellos son mis tíos. Mis tíos se llaman ${list(tios)}.`,"They are my aunts and uncles."],
   [`Tengo seis primos. Mis primos se llaman ${list(prims)}.`,"I have six cousins."],
   [`Mi prima ${nm("pra1")} es simpática. Su hermano es ${nm("pri1")}.`,"My cousin ___ is nice. Her brother is ___. (su = her)"],
   [`Nuestro perro se llama ${nm("perro")}. ¡Nuestra familia es grande!`,"Our dog's name is ___. Our family is big!"]
  ];
}
function script(){
  const L=scriptLines();
  $("#app").innerHTML=`<header style="display:grid;gap:6px"><span class="eyebrow">Read it, then say it without looking</span><h2>Mi Presentación</h2></header>
  <div class="panel"><div class="row" style="justify-content:space-between"><button class="btn" id="all">🔊 Play the whole thing</button>${slowToggle()}</div>
  <p class="muted" style="font-size:14px">This uses the names from <b>Mi árbol</b>. Change them there. Tap any line to hear it, pause, and repeat it out loud.</p>
  <div class="script">${L.map(([es,en])=>`<p><span><b>${esc(es)}</b><br><span class="en">${esc(en)}</span></span>${sb(es,"")}</p>`).join("")}</div>
  <div class="row"><button class="btn ghost" id="hide">Hide the Spanish (test yourself)</button></div></div>`;
  $("#all").onclick=()=>{try{speechSynthesis.cancel();L.forEach(([es])=>{const u=new SpeechSynthesisUtterance(es);u.lang=VOICE?VOICE.lang:"es-MX";if(VOICE)u.voice=VOICE;u.rate=S.slow?.65:.9;speechSynthesis.speak(u);});}catch(e){}};
  $("#hide").onclick=()=>{document.querySelectorAll(".script b").forEach(b=>b.style.visibility=b.style.visibility==="hidden"?"":"hidden");};
}

nav("home");
</script>
